{ id:'m5', nome:'Mates básicos', desc:'Os xeque-mates que todo jogador precisa saber', fases:[
  { id:'corredor', nome:'Mate do corredor', icone:'r',
    intro:'No <b>mate do corredor</b> o rei fica preso na última fileira atrás dos <b>próprios peões</b>, e uma torre ou dama dá xeque nessa fileira. É o mate mais comum entre iniciantes. Para se proteger, abra uma “janelinha” avançando um peão do roque (h3 ou g3).',
    ex:[
      {t:'mate', n:1, fen:'6k1/5ppp/8/8/8/8/5PPP/3R2K1 w - - 0 1', p:'O rei preto está preso atrás dos peões. Mate em 1.', sol:['Rd8#'],
        ok:'Mate do corredor!', err:'Entre com a torre na última fileira.'},
      {t:'mate', n:1, fen:'6k1/5ppp/8/8/8/8/Q4PPP/6K1 w - - 0 1', p:'A dama também faz esse mate. Mate em 1.', sol:['Qa8#'],
        ok:'Isso! A dama chegou à última fileira.', err:'Leve a dama até a 8ª fileira.'},
      {t:'seq', fen:'3r2k1/5ppp/8/8/8/8/R4PPP/6K1 w - - 0 1', p:'Agora é você quem está ameaçado: as pretas querem Td1 mate! Faça um lance que evite o mate do corredor.',
        line:[['h3','g3','h4','g4','Ra1','Kf1','f3','f4']],
        ok:'Boa defesa! Agora o rei tem por onde escapar (ou a fileira está protegida).', err:'Esse lance não resolve: Td1 seria mate. Abra uma casa de fuga para o rei ou proteja a primeira fileira.'},
      {t:'mate', n:2, fen:'r2r2k1/5ppp/8/8/8/3R4/3R1PPP/6K1 w - - 0 1', p:'Mate em 2: suas torres dobradas vencem a defesa da última fileira.', sol:['Rxd8+','Rxd8','Rxd8#'],
        ok:'Troca na última fileira e mate do corredor.', err:'Capture em d8: depois da recaptura, a outra torre dá mate.'}
    ]},
  { id:'damarei', nome:'Dama e rei contra rei', icone:'q',
    intro:'Com <b>dama e rei contra rei</b> você sempre ganha. O plano: 1) use a dama para <b>empurrar o rei adversário para a borda</b>; 2) traga o <b>seu rei</b> para perto; 3) dê mate com a dama protegida pelo rei (ou na borda, com seu rei tirando as casas de fuga). Cuidado com o <b>afogamento</b>: sempre deixe um lance para o rei adversário até a hora do mate.',
    ex:[
      {t:'mate', n:1, fen:'7k/8/6K1/8/8/8/8/1Q6 w - - 0 1', p:'Seu rei já tira as casas de fuga. Mate em 1.', sol:['Qb8#'],
        ok:'Mate na borda!', err:'Dê xeque na última fileira: o seu rei cobre as casas da frente.'},
      {t:'mate', n:2, fen:'7k/8/5K2/8/8/8/8/1Q6 w - - 0 1', p:'Mate em 2. Cuidado: há um lance que afoga o rei preto!', sol:['Kg6','Kg8','Qb8#'],
        ok:'Perfeito: primeiro o rei chegou perto, depois a dama deu o mate.', err:'Esse lance não leva ao mate em 2. Aproxime o rei sem tirar TODAS as casas do rei preto.'},
      {t:'mate', n:2, fen:'k7/8/2K5/8/8/8/8/6Q1 w - - 0 1', p:'Mesma ideia no outro canto. Mate em 2.', sol:['Kb6','Kb8','Qg8#'],
        ok:'Isso! Rei perto + dama na borda = mate.', err:'Traga o rei para mais perto, deixando um lance para as pretas.'},
      {t:'quiz', q:'Qual é o maior perigo quando você tem dama e rei contra rei?', opts:['Perder a dama','Afogar o rei adversário e empatar','Ficar sem tempo'], a:1,
        ok:'Exato. Antes de cada lance, confira se o rei adversário ainda tem um lance (ou se é mate).', err:'O erro clássico é deixar o rei sem lances e sem xeque: afogamento.'}
    ]},
  { id:'torrerei', nome:'Torre e rei contra rei', icone:'r',
    intro:'Com <b>torre e rei contra rei</b> o mate é sempre na <b>borda</b>. A torre funciona como uma parede que corta o rei adversário; o seu rei fica <b>de frente para o rei adversário</b> (oposição) e então a torre dá xeque na borda: mate.',
    ex:[
      {t:'mate', n:1, fen:'7k/8/6K1/8/8/8/8/R7 w - - 0 1', p:'Os reis já estão frente a frente. Mate em 1.', sol:['Ra8#'],
        ok:'Mate! O rei tira as casas da frente e a torre ataca na borda.', err:'Dê xeque com a torre na última fileira.'},
      {t:'mate', n:2, fen:'7k/8/5K2/8/8/8/8/R7 w - - 0 1', p:'Mate em 2. Primeiro coloque o seu rei no lugar certo.', sol:['Kg6','Kg8','Ra8#'],
        ok:'Isso: rei na frente do rei, torre na borda.', err:'Esse lance não força mate em 2. Aproxime o seu rei.'},
      {t:'mate', n:2, fen:'8/8/8/8/k7/2K5/8/7R w - - 0 1', p:'Mate em 2. Use a torre como “parede” para cortar a fuga do rei.', sol:['Rh5','Ka3','Ra5#'],
        ok:'A torre cortou a fileira, o rei ficou sem opção e veio o mate.', err:'Feche a 5ª fileira com a torre: o rei preto só poderá ir para a3.'},
      {t:'quiz', q:'No mate de torre, onde deve estar o seu rei na hora do xeque final?', opts:['Longe, para não atrapalhar','De frente para o rei adversário, tirando as casas de fuga','Atrás da torre'], a:1,
        ok:'Certo: é a “oposição”.', err:'O rei precisa ajudar: ele tira as três casas da frente do rei adversário.'}
    ]},
  { id:'pastor', nome:'Mate pastor', icone:'q',
    intro:'O <b>mate pastor</b> é o truque mais famoso contra iniciantes: dama e bispo atacam juntos a casa <b>f7</b> (protegida só pelo rei) e dão mate em 4 lances. Aprenda a fazer — e, na próxima fase, a nunca cair nele.',
    ex:[
      {t:'seq', fen:INICIO, p:'Jogue o mate pastor completo.',
        steps:['Comece com o peão do rei: e4.','Saia com a dama para h5 (ela ataca e5 e mira f7).','Traga o bispo para c4: agora dama e bispo atacam f7.','As pretas não defenderam f7. Dê o mate!'],
        line:['e4','e5','Qh5','Nc6','Bc4','Nf6','Qxf7#'],
        ok:'Mate pastor! Dama em f7, protegida pelo bispo.', err:'Siga a instrução do passo atual.'},
      {t:'mate', n:1, fen:'r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR w KQkq - 4 4', p:'Outra versão: aqui a dama está em f3. Mate em 1.', sol:['Qxf7#'],
        ok:'O mesmo padrão: dama + bispo em f7.', err:'A casa fraca é f7.'},
      {t:'quiz', q:'Qual é a casa fraca das pretas que o mate pastor ataca?', opts:['e5','f7','h7','d8'], a:1,
        ok:'Isso. No começo, f7 só é defendida pelo rei.', err:'É f7 — a única casa defendida apenas pelo rei no início.'}
    ]},
  { id:'antipastor', nome:'Defesa contra o mate pastor', icone:'n',
    intro:'Defender-se do mate pastor é fácil se você souber o que procurar: <b>proteja e5</b> com o cavalo, <b>feche a diagonal</b> ou <b>defenda f7</b>, e depois ganhe tempo atacando a dama adversária com seus lances de desenvolvimento.',
    ex:[
      {t:'seq', fen:'rnbqkbnr/pppp1ppp/8/4p2Q/4P3/8/PPPP1PPP/RNB1KBNR b KQkq - 1 2', p:'Você joga com as pretas. A dama branca ataca o peão de e5. Defenda-o desenvolvendo o cavalo da dama.', line:['Nc6'],
        ok:'Bom! Defendeu o peão e desenvolveu uma peça.', err:'Desenvolva o cavalo de b8 para c6: ele protege e5.'},
      {t:'seq', fen:'r1bqkbnr/pppp1ppp/2n5/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 3 3', p:'Atenção: as brancas ameaçam Dxf7 mate! Defenda.', line:[['g6','Qe7','Qf6']],
        ok:'Ameaça neutralizada. Com g6 você ainda ataca a dama!', err:'Esse lance não impede Dxf7 mate. Feche o caminho da dama (g6) ou defenda f7 com a dama.',
        wrong:{'Nh6':'Defende f7, mas o cavalo fica mal colocado na borda. Prefira g6 ou De7.'}},
      {t:'seq', fen:'r1bqkbnr/pppp1p1p/2n3p1/4p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR b KQkq - 1 4', p:'A dama recuou para f3 e ameaça mate em f7 de novo. Defenda desenvolvendo uma peça.', line:[['Nf6','Qe7','Qf6']],
        ok:'Pronto! As brancas perderam tempo com a dama e você está bem desenvolvido.', err:'Bloqueie a coluna “f” com o cavalo (Cf6) ou defenda f7.'},
      {t:'quiz', q:'Por que sair muito cedo com a dama costuma ser ruim?', opts:['Porque é proibido','Porque ela vira alvo e o adversário ganha tempo desenvolvendo peças','Porque a dama é fraca no começo'], a:1,
        ok:'Exato: cada ataque à dama é um lance de desenvolvimento grátis para o adversário.', err:'A dama exposta é atacada por peças menores, e você perde tempo fugindo.'}
    ]}
]},

{ id:'m6', nome:'Estratégia e aberturas', desc:'Como começar bem uma partida', fases:[
  { id:'centro', nome:'Controle do centro', icone:'p',
    intro:'As quatro casas centrais (<b>e4, d4, e5, d5</b>) são as mais importantes do tabuleiro: do centro as peças alcançam os dois lados rapidamente. Na abertura, <b>ocupe o centro com peões</b> e controle-o com cavalos e bispos.',
    ex:[
      {t:'quiz', q:'Quais são as quatro casas centrais?', opts:['a1, a8, h1, h8','e4, d4, e5, d5','c3, f3, c6, f6'], a:1, ok:'Isso!', err:'O centro é formado por e4, d4, e5 e d5.'},
      {t:'seq', fen:INICIO, p:'Comece a partida ocupando o centro com um peão.', line:[['e4','d4']],
        ok:'Ótimo começo: o peão ocupa o centro e abre caminho para o bispo e a dama.', err:'Avance o peão do rei (e4) ou o da dama (d4) duas casas.'},
      {t:'seq', fen:'rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2', p:'Desenvolva um cavalo atacando o peão central das pretas.', line:['Nf3'],
        ok:'Cf3: desenvolve, controla o centro e ataca e5.', err:'O cavalo de g1 vai para f3, de onde ataca e5.'},
      {t:'quiz', q:'Quantas casas um cavalo controla quando está no centro (e4) e quando está no canto (a1)?', opts:['8 no centro e 2 no canto','4 e 4','2 no centro e 8 no canto'], a:0,
        ok:'Por isso dizem: “cavalo na borda, cavalo que se afoga”.', err:'No centro o cavalo tem 8 saltos; no canto, apenas 2.'}
    ]},
  { id:'desenv', nome:'Desenvolvimento', icone:'n',
    intro:'<b>Desenvolver</b> é tirar as peças da casa inicial e colocá-las em jogo. Regras práticas: saia primeiro com <b>cavalos e bispos</b>; não mova a mesma peça duas vezes sem necessidade; não saia cedo com a dama; e faça o roque logo.',
    ex:[
      {t:'seq', fen:'r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3', p:'Desenvolva o bispo do rei para uma casa ativa.', line:[['Bc4','Bb5']],
        ok:'Bispo ativo e o caminho livre para o roque.', err:'Leve o bispo de f1 para c4 ou b5.'},
      {t:'quiz', q:'Na abertura, qual é o melhor plano?', opts:['Avançar todos os peões da borda','Desenvolver cavalos e bispos e fazer o roque','Atacar sozinho com a dama'], a:1,
        ok:'Isso. Um exército inteiro em jogo vence uma peça sozinha.', err:'Peças desenvolvidas + rei rocado é a receita básica.'},
      {t:'seq', fen:'r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4', p:'Falta desenvolver o cavalo da dama. Leve-o para a melhor casa.', line:['Nc3'],
        ok:'Cc3: mais uma peça em jogo, de olho no centro.', err:'O cavalo de b1 fica melhor em c3.'},
      {t:'quiz', q:'Quantas vezes você deve mover a mesma peça na abertura?', opts:['Quantas quiser','De preferência uma só, até desenvolver as outras','Sempre duas'], a:1,
        ok:'Certo. Cada lance repetido é uma peça a menos em jogo.', err:'Mover a mesma peça de novo atrasa o desenvolvimento das outras.'}
    ]},
  { id:'seguranca', nome:'Segurança do rei', icone:'k',
    intro:'Um rei no centro, com colunas abertas, é um alvo. Por isso: <b>faça o roque cedo</b>, <b>não avance sem motivo os peões da frente do rei rocado</b> (eles são o escudo) e fique atento a peças inimigas se aproximando.',
    ex:[
      {t:'seq', fen:'r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4', p:'Cavalo e bispo do lado do rei já saíram. Coloque o rei em segurança.', line:['O-O'],
        ok:'Rei protegido e torre pronta para entrar no jogo.', err:'Faça o roque pequeno: mova o rei de e1 para g1.'},
      {t:'quiz', q:'Depois do roque pequeno, quais peões formam o “escudo” do rei e não devem avançar sem necessidade?', opts:['a, b e c','d e e','f, g e h'], a:2,
        ok:'Isso. Cada avanço desses peões abre buracos perto do rei.', err:'São os peões de f, g e h, na frente do rei rocado.'},
      {t:'seq', fen:'r3k2r/ppp1q1pp/2n2p2/8/8/2Q2N2/PPP2PPP/R4RK1 w kq - 0 1', p:'O rei preto ficou no centro, com a dama na frente dele na coluna aberta. Castigue!', line:[['Rfe1','Rae1'],'Qxe1+',['Rxe1+','Nxe1']],
        ok:'A dama estava cravada contra o rei no centro. Você ganhou dama por torre.', err:'Coloque uma torre na coluna “e”: a dama fica cravada contra o rei.'},
      {t:'quiz', q:'Seu rei está no centro e o adversário já abriu colunas. O que fazer?', opts:['Atacar com os peões','Rocar o quanto antes','Trocar os cavalos'], a:1,
        ok:'Sim: segurança primeiro.', err:'Tire o rei do centro o mais rápido possível com o roque.'}
    ]},
  { id:'peoes', nome:'Estrutura de peões', icone:'p',
    intro:'Os peões são o “esqueleto” da posição. Três conceitos básicos: <b>peões dobrados</b> (dois na mesma coluna — atrapalham um ao outro), <b>peão isolado</b> (sem peões amigos nas colunas vizinhas — difícil de defender) e <b>peão passado</b> (sem peões inimigos na frente nem nas colunas vizinhas — pode correr para a promoção).',
    ex:[
      {t:'quiz', fen:'4k3/8/8/8/8/2P5/2P5/4K3 w - - 0 1', q:'Dois peões brancos estão na mesma coluna. Como eles se chamam?', opts:['Peões passados','Peões dobrados','Peões isolados'], a:1,
        ok:'Dobrados: o de trás não consegue avançar enquanto o da frente não sair.', err:'Dois peões da mesma cor na mesma coluna são “dobrados”.'},

/* monta a lista de lances em notação algébrica (em português). clicavel -> botões */
function htmlLances(hist, atual, clicavel) {
  if (!hist.length) return '<div class="vazio">Os lances aparecem aqui.</div>';
  let h = '';
  for (let i = 0; i < hist.length; i += 2) {
    h += `<span class="n">${i / 2 + 1}.</span>`;
    for (let k = i; k < i + 2; k++) {
      if (k >= hist.length) { h += '<span></span>'; continue; }
      const cls = 'l' + (k === atual ? ' atual' : '');
      h += clicavel ? `<button class="${cls}" data-ply="${k}">${sanPt(hist[k])}</button>` : `<span class="${cls}">${sanPt(hist[k])}</span>`;
    }
  }
  return h;
}
/* atualiza a barra de avaliação. av = {cp, mate} do ponto de vista das brancas */
function pintarBarra(el, av, ori) {
  if (!el) return;
  const nota = notaUnica(av);
  el.classList.toggle('inv', ori === 'b');
  el.firstElementChild.style.height = limita(chanceVitoria(nota), 3, 97) + '%';
  el.lastElementChild.textContent = av.mate != null ? 'M' + Math.abs(av.mate) : (Math.abs(nota) >= 9000 ? '#' : (nota >= 0 ? '+' : '−') + Math.abs(nota / 100).toFixed(1));
  el.title = 'Avaliação: ' + (nota > 30 ? 'brancas melhor' : nota < -30 ? 'pretas melhor' : 'equilibrado');
}

    const grupo = (id, chave, conv) => $(id).addEventListener('click', e => {
      const b = e.target.closest('.op'); if (!b) return;
      $$('.op', $(id)).forEach(x => x.classList.toggle('on', x === b));
      c[chave] = conv(b.dataset.v); Dados.salvar();
    });
    grupo('#op-nivel', 'nivel', Number); grupo('#op-cor', 'cor', String); grupo('#op-rel', 'relogio', Number);
    $('#comecar').onclick = () => App.ir('jogo');
  },

  /* ---------- início da partida ---------- */
  iniciar() {
    const c = Dados.d.cfg;
    this.g = new Chess(); this.nivel = c.nivel; this.relogio = c.relogio;
    this.cor = c.cor === 'a' ? (Math.random() < 0.5 ? 'w' : 'b') : c.cor;
    this.tempos = { w: this.relogio, b: this.relogio };
    this.fim = false; this.pensando = false; this.ficha++; this.av = { cp: 20, mate: null }; this.textoFim = '';
    App.cabecalho('Partida · ' + NIVEIS[this.nivel].nome, () => this.sair());
    $('#tela').innerHTML = `<div class="jogo">
      <div class="col-tab">
        <div class="jogador" id="j-cima"><span class="nome"></span><span class="relogio${this.relogio ? '' : ' oculto'}"></span></div>
        <div class="tab-linha" id="tab-linha"><div class="barra-av" id="barra"><i></i><span></span></div></div>
        <div class="jogador" id="j-baixo"><span class="nome"></span><span class="relogio${this.relogio ? '' : ' oculto'}"></span></div>
        <div class="controles">
          <button class="bt" id="b-desfazer">${ICONES.desfazer}Desfazer</button>
          <button class="bt" id="b-dica">${ICONES.dica}Dica</button>
          <button class="bt" id="b-virar">${ICONES.virar}Virar</button>
          <button class="bt" id="b-desistir">${ICONES.desistir}Desistir</button>
          <button class="bt" id="b-nova">${ICONES.nova}Nova</button>
        </div>
      </div>
      <div class="lateral">
        <div class="cartao"><div class="status" id="status"></div><div class="sub" id="motor-rot" style="margin-top:4px;font-size:.8rem"></div></div>
        <div class="cartao"><h3>Lances</h3><div class="lances" id="lances"></div></div>
      </div></div>`;
    this.tab = new Tabuleiro($('#tab-linha'), {
      alvos: casa => this.alvos(casa),
      promocao: (de, para) => { const p = this.g.get(de); return !!p && p.type === 'p' && (para[1] === '8' || para[1] === '1'); },
      mover: (de, para, promo) => this.lanceJogador(de, para, promo)
    });
    this.tab.orientar(this.cor);
    this.tab.posicionar(mapaDoJogo(this.g), false);
    $('#b-desfazer').onclick = () => this.desfazer();
    $('#b-dica').onclick = () => this.dica();
    $('#b-virar').onclick = () => { this.tab.orientar(this.tab.ori === 'w' ? 'b' : 'w'); this.pintar(); };
    $('#b-desistir').onclick = () => this.desistir();
    $('#b-nova').onclick = () => this.nova();
    Motor.aoMudar = () => { const r = $('#motor-rot'); if (r) r.innerHTML = Motor.rotulo(); };
    Motor.aoMudar();
    App.aoSair = () => this.encerrar();
    this.pintar();
    if (this.relogio) { this.ultTick = performance.now(); this.timer = setInterval(() => this.tique(), 200); }
    if (this.cor === 'b') this.lanceComputador();
  },
  encerrar() { this.fim = true; this.ficha++; Motor.cancelar(); clearInterval(this.timer); this.timer = null; Motor.aoMudar = null; },

  /* ---------- desenho ---------- */
  pintar() {
    const g = this.g, hist = g.history();
    $('#lances').innerHTML = htmlLances(hist, hist.length - 1, false);
    const at = $('#lances .atual'); if (at) at.scrollIntoView({ block: 'nearest' });
    const euEmbaixo = this.tab.ori === this.cor;
    const nomeEu = 'Você <small>' + (this.cor === 'w' ? 'brancas' : 'pretas') + '</small>';
    const nomePc = 'Computador <small>' + NIVEIS[this.nivel].nome + '</small>' + (this.pensando ? '<span class="pensando"><i></i><i></i><i></i></span>' : '');
    $('#j-cima .nome').innerHTML = euEmbaixo ? nomePc : nomeEu;
    $('#j-baixo .nome').innerHTML = euEmbaixo ? nomeEu : nomePc;
    this.pintarRelogios();
    pintarBarra($('#barra'), this.av, this.tab.ori);
    let s;
    if (this.fim) s = this.textoFim || 'Partida encerrada.';
    else if (g.turn() === this.cor) s = (g.in_check() ? '<b style="color:var(--ruim)">Xeque!</b> ' : '') + 'Sua vez de jogar.';
    else s = 'O computador está pensando…';
    $('#status').innerHTML = s;
  },
  pintarRelogios() {
    if (!this.relogio) return;
    const euEmbaixo = this.tab.ori === this.cor, corCima = euEmbaixo ? (this.cor === 'w' ? 'b' : 'w') : this.cor, corBaixo = corCima === 'w' ? 'b' : 'w';
    const pinta = (el, cor) => { el.textContent = fmtTempo(this.tempos[cor]); el.classList.toggle('ativo', !this.fim && this.g.turn() === cor); el.classList.toggle('baixo', this.tempos[cor] < 30); };
    pinta($('#j-cima .relogio'), corCima); pinta($('#j-baixo .relogio'), corBaixo);
  },
  tique() {
    const agora = performance.now(), dt = (agora - this.ultTick) / 1000; this.ultTick = agora;
    if (this.fim) return;
    const vez = this.g.turn(); this.tempos[vez] -= dt;
    if (this.tempos[vez] <= 0) { this.tempos[vez] = 0; this.finalizar(vez === this.cor ? 'd' : 'v', 'tempo esgotado'); return; }
    this.pintarRelogios();
  },
  marcarUltimo(m) { this.tab.marcar({ ult: m ? [m.from, m.to] : [], xq: this.g.in_check() ? casaDoRei(this.g, this.g.turn()) : null }); },

  /* ---------- lances ---------- */
  alvos(casa) {
    if (this.fim || this.pensando || this.g.turn() !== this.cor) return null;
    const p = this.g.get(casa); if (!p || p.color !== this.cor) return null;
    return Array.from(new Set(this.g.moves({ square: casa, verbose: true }).map(m => m.to)));
  },
  lanceJogador(de, para, promo) {
    if (this.fim) return;
    const m = this.g.move({ from: de, to: para, promotion: promo || 'q' });
    if (!m) { this.tab.redesenhar(); return; }
    this.ficha++; Motor.cancelar(); this.tab.setas([]);
    this.aposLance(m);
    if (!this.fim) this.lanceComputador();
  },
  aposLance(m) {
    this.tab.posicionar(mapaDoJogo(this.g));
    this.marcarUltimo(m);
    const g = this.g;
    if (g.game_over()) {
      if (g.in_checkmate()) this.finalizar(m.color === this.cor ? 'v' : 'd', 'xeque-mate');
      else if (g.in_stalemate()) this.finalizar('e', 'afogamento');
      else if (g.insufficient_material()) this.finalizar('e', 'material insuficiente');
      else if (g.in_threefold_repetition()) this.finalizar('e', 'repetição de posição');
      else this.finalizar('e', 'regra dos 50 lances');
      return;
    }
    this.pintar();
  },
  async lanceComputador() {
    const ficha = this.ficha, g = this.g, n = NIVEIS[this.nivel], t0 = performance.now();
    this.pensando = true; this.pintar();
    const legais = g.moves({ verbose: true });
    let uci = null;
    const ply = g.history().length;
    // pequena variação na abertura, para as partidas não serem sempre iguais
    if (ply === 0) uci = uciDe(lanceDeSan(g, sorteia(['e4', 'e4', 'd4', 'd4', 'c4', 'Nf3'])));
    else if (ply === 1) {
      const p = g.history()[0];
      const opc = p === 'e4' ? ['e5', 'e5', 'c5', 'e6', 'c6'] : p === 'd4' ? ['d5', 'd5', 'Nf6', 'Nf6'] : null;
      if (opc) uci = uciDe(lanceDeSan(g, sorteia(opc)));
    }
    if (!uci && legais.length > 1 && Math.random() < n.erro) uci = uciDe(sorteia(legais));   // níveis fracos erram de propósito
    if (!uci) {
      const r = await Motor.analisar(g.fen(), { skill: n.skill, depth: n.depth, movetime: n.tempo, profSimples: n.ps });
      if (ficha !== this.ficha || this.fim) return;
      if (r && r.best) uci = r.best;
    }
    const resto = 500 - (performance.now() - t0);
    if (resto > 0) { await espera(resto); if (ficha !== this.ficha || this.fim) return; }
    let m = uci ? g.move({ from: uci.slice(0, 2), to: uci.slice(2, 4), promotion: uci[4] || undefined }) : null;
    if (!m) m = g.move(sorteia(legais));               // segurança: nunca fica sem lance
    this.pensando = false; this.ficha++;
    this.aposLance(m);
    if (!this.fim) this.pedirAvaliacao();
  },
  async pedirAvaliacao() {
    const ficha = this.ficha, vez = this.g.turn();
    const r = await Motor.analisar(this.g.fen(), { depth: 11, movetime: 350, profSimples: 2 });
    if (!r || ficha !== this.ficha) return;
    this.definirAv(r, vez);
  },
  definirAv(r, vez) {
    const s = vez === 'w' ? 1 : -1;
    this.av = { cp: r.cp != null ? r.cp * s : null, mate: r.mate != null ? r.mate * s : null };
    pintarBarra($('#barra'), this.av, this.tab.ori);
  },

  /* ---------- botões ---------- */
  desfazer() {
    if (this.fim) return;
    const g = this.g, n = g.history().length;
    const qtd = g.turn() === this.cor ? 2 : 1;
    if (n < qtd || (qtd === 2 && n < 2)) { aviso('Não há lance seu para desfazer.'); return; }
    this.ficha++; Motor.cancelar(); this.pensando = false;
    for (let i = 0; i < qtd; i++) g.undo();
    this.tab.limparSelecao(); this.tab.setas([]);
    this.tab.posicionar(mapaDoJogo(g));
    const h = g.history({ verbose: true }); this.marcarUltimo(h[h.length - 1]);
    this.pintar();
    if (g.turn() !== this.cor) this.lanceComputador(); else this.pedirAvaliacao();
  },
  async dica() {
    if (this.fim) return;
    if (this.g.turn() !== this.cor || this.pensando) { aviso('Espere a sua vez para pedir uma dica.'); return; }
    const ficha = ++this.ficha; Motor.cancelar();
    $('#status').textContent = 'Procurando a melhor jogada…';
    const r = await Motor.analisar(this.g.fen(), { depth: 14, movetime: 900, profSimples: 3 });
    if (ficha !== this.ficha || this.fim) return;
    if (!r || !r.best) { this.pintar(); aviso('Não consegui calcular a dica agora.'); return; }
    this.definirAv(r, this.g.turn());
    const m = lanceDeUci(this.g, r.best);
    this.tab.setas([{ de: r.best.slice(0, 2), para: r.best.slice(2, 4), cor: 'azul' }]);
    $('#status').innerHTML = 'Dica: a melhor jogada é <b>' + (m ? sanPt(m.san) : r.best) + '</b> (seta azul).';
  },
  async desistir() {
    if (this.fim) return;
    const ok = await modal('Desistir da partida?', 'A partida conta como derrota e você verá a análise dos seus lances.', [{ txt: 'Continuar jogando', val: false }, { txt: 'Desistir', cls: 'perigo', val: true }]);
    if (ok && !this.fim) this.finalizar('d', 'desistência');
  },
  async sair() {
    if (!this.fim && this.g.history().length > 0) {
      const ok = await modal('Sair da partida?', 'A partida atual será abandonada e não entra nas estatísticas.', [{ txt: 'Continuar jogando', val: false }, { txt: 'Sair', cls: 'perigo', val: true }]);
      if (!ok) return;
    }
    App.ir('menu');
  },
  async nova() {
    if (!this.fim && this.g.history().length > 0) {
      const ok = await modal('Começar outra partida?', 'A partida atual será abandonada e não entra nas estatísticas.', [{ txt: 'Voltar', val: false }, { txt: 'Nova partida', cls: 'pri', val: true }]);
      if (!ok) return;
    }
    App.ir('config');
  },

  /* ---------- fim de jogo: registra e abre a análise ---------- */
  finalizar(res, motivo) {
    if (this.fim) return;
    this.fim = true; this.ficha++; this.pensando = false; Motor.cancelar(); clearInterval(this.timer); this.timer = null;
    const titulo = res === 'v' ? 'Você venceu!' : res === 'd' ? 'Você perdeu' : 'Empate';
    this.textoFim = `<b>${titulo}</b> — ${motivo}.`;
    this.tab.limparSelecao(); this.pintar();
    Analise.iniciar({ lances: this.g.history({ verbose: true }), cor: this.cor, nivel: this.nivel, res, motivo, titulo });
  }
};
function lanceDeSan(g, san) { const m = g.move(san); if (m) g.undo(); return m || g.moves({ verbose: true })[0]; }

/* ==========================================================================
   ANÁLISE DA PARTIDA — classifica cada lance do jogador e explica os erros
   ========================================================================== */
const CLASSES = {
  exc: { nome: 'Excelente', cls: 'c-exc' }, bom: { nome: 'Bom', cls: 'c-bom' }, imp: { nome: 'Imprecisão', cls: 'c-imp' },
  err: { nome: 'Erro', cls: 'c-err' }, gra: { nome: 'Erro grave', cls: 'c-gra' }
};
const ROTULO_TAG = {
  pendurada: 'Peças penduradas (sem defesa)', mate_perdido: 'Xeque-mates perdidos', permitiu_mate: 'Permitiu xeque-mate',
  troca_ruim: 'Trocas ruins', garfo: 'Garfos permitidos', nao_capturou: 'Peças grátis não capturadas',
  tatica_perdida: 'Táticas não vistas', rei_exposto: 'Rei exposto', material: 'Perda de material em trocas', posicional: 'Lances passivos'
};
const DICA_TAG = {
  pendurada: 'Você costuma deixar peças desprotegidas. Antes de cada lance, pergunte: “o que o meu adversário ameaça? Todas as minhas peças estão defendidas?”',
  mate_perdido: 'Você deixou passar xeque-mate. Em toda posição, olhe primeiro os xeques que você pode dar: o mate quase sempre começa com um xeque.',
  permitiu_mate: 'Seu rei ficou em perigo. Antes de jogar, confira todos os xeques que o adversário pode dar no lance seguinte e deixe uma casa de fuga para o rei.',
  troca_ruim: 'Cuidado com as trocas: compare os valores (peão 1, cavalo e bispo 3, torre 5, dama 9) e só capture uma peça defendida se o que você ganha vale mais do que o que perde.',
  garfo: 'Você caiu em garfos. Evite deixar duas peças valiosas (principalmente rei, dama e torres) ao alcance do mesmo cavalo ou peão adversário.',
  nao_capturou: 'Você deixou de capturar peças grátis. A cada lance, procure peças adversárias sem defesa: capturar de graça é o jeito mais simples de ganhar.',
  tatica_perdida: 'Você deixou passar golpes táticos. Antes de jogar, examine xeques, capturas e ameaças, nessa ordem. Treine na seção Desafios táticos.',
  rei_exposto: 'Seu rei ficou exposto. Faça o roque cedo e evite avançar os peões que ficam na frente do rei.',
  material: 'Você perdeu material em sequências de trocas. Conte atacantes e defensores de cada casa antes de começar ou permitir uma troca.',
  posicional: 'Alguns lances foram passivos. Na dúvida, melhore a sua pior peça: desenvolva, ocupe o centro e coloque as torres em colunas abertas.'
};
const DICAS_GERAIS = [
  'Antes de cada lance, faça a checagem de segurança: xeques, capturas e ameaças — as suas e as do adversário.',
  'Na abertura: ocupe o centro, desenvolva cavalos e bispos e faça o roque antes de atacar.',
  'Resolva alguns desafios táticos por dia: reconhecer padrões é o que mais aumenta a força de jogo.'
];
const gen = (t, masc, fem) => FEM[t] ? fem : masc;

/* gera a explicação em português de um lance ruim, por regras de detecção */
function explicarErro(c) {
  const R = (tag, texto) => ({ tag, texto });
  const g0 = new Chess(c.fenAntes), eu = g0.turn(), ele = eu === 'w' ? 'b' : 'w', m = c.lance;
  const melhor = lanceDeUci(g0, c.melhorUci), mTxt = melhor ? sanPt(melhor.san) : null;
  const g1 = new Chess(c.fenAntes); g1.move(m.san);
  const resp = c.respUci ? lanceDeUci(g1, c.respUci) : null, rTxt = resp ? sanPt(resp.san) : null;
  const pm = m.promotion || m.piece;          // peça que ficou na casa de destino
  const fimMelhor = mTxt ? ` O melhor era ${mTxt}.` : '';

  // 1) deixou passar um xeque-mate
  if (c.mateAntes > 0 && c.notaDepois < 9000 && mTxt)
    return R('mate_perdido', c.mateAntes === 1 ? `Você deixou passar um xeque-mate em 1 lance: ${mTxt}.` : `Você deixou passar um xeque-mate em ${c.mateAntes} lances. A sequência começava com ${mTxt}.`);
  // 2) permitiu xeque-mate
  if (c.notaDepois < -9000 && c.notaAntes > -9000) {
    const n = c.mateDepois ? Math.abs(c.mateDepois) : 0;
    return R('permitiu_mate', `Esse lance permite xeque-mate${n ? ' em ' + n + (n === 1 ? ' lance' : ' lances') : ''}${rTxt ? ': o adversário joga ' + rTxt : ''}. Antes de jogar, confira os xeques e as ameaças contra o seu rei.` + fimMelhor);
  }
  // 3) a resposta do adversário captura algo com lucro
  if (resp && resp.captured) {
    const g2 = new Chess(g1.fen()); g2.move(resp.san);
    const lucro = VALOR[resp.captured] - ganhoNaCasa(g2, resp.to);
    if (lucro > 0) {
      if (resp.to === m.to) {
        if (m.captured && VALOR[m.piece] > VALOR[m.captured])
          return R('troca_ruim', `Você capturou ${umPeca(m.captured)} (${VALOR[m.captured]}) com ${oPeca(m.piece)} (${VALOR[m.piece]}), mas a casa estava defendida: depois de ${rTxt} você troca uma peça de maior valor por uma de menor.` + fimMelhor);
        const defendida = atacantes(g1, m.to, eu).length > 0;
        return R('pendurada', (defendida
          ? `Você colocou ${oPeca(pm)} em ${m.to}, onde ${gen(pm, 'ele', 'ela')} pode ser capturad${gen(pm, 'o', 'a')} por uma peça de menor valor: ${rTxt} ganha material.`
          : `Você deixou ${oPeca(pm)} sem defesa em ${m.to}: o adversário captura de graça com ${rTxt}.`) + fimMelhor);
      }
      const alvo = resp.captured; let jaEstava = false;
      if (!g0.in_check()) {
        const p = c.fenAntes.split(' '); p[1] = ele; p[3] = '-';
        const gs = new Chess();
        if (gs.load(p.join(' '))) jaEstava = gs.moves({ verbose: true }).some(x => x.to === resp.to && x.captured && ganhoDaCaptura(gs, x) > 0);
      }
      return R('pendurada', (jaEstava
        ? `${suaPeca(alvo).replace(/^s/, 'S')} em ${resp.to} já estava atacad${gen(alvo, 'o', 'a')} e continuou sem proteção: o adversário captura com ${rTxt}.`
        : `Ao jogar ${sanPt(m.san)}, você deixou ${suaPeca(alvo)} em ${resp.to} sem defesa suficiente: o adversário captura com ${rTxt}.`) + fimMelhor);
    }
  }
  // 4) permitiu um garfo
  if (resp) {
    const g2 = new Chess(g1.fen()); g2.move(resp.san);
    const gf = detectarGarfo(g2, resp.to);
    if (gf) return R('garfo', `Você permitiu um garfo: depois de ${rTxt}, ${oPeca(gf.peca)} adversári${gen(gf.peca, 'o', 'a')} ataca ${gf.alvos.map(a => suaPeca(a.type)).join(' e ')} ao mesmo tempo.` + fimMelhor);
  }
  // 5) não capturou uma peça que estava de graça
  if (melhor && melhor.captured) {
    const gc = ganhoDaCaptura(g0, melhor);
    const meu = m.captured ? ganhoDaCaptura(g0, lanceDeUci(g0, uciDe(m))) : 0;
    if (gc > 0 && meu < gc) {
      const def = melhor.flags.indexOf('e') < 0 && atacantes(g0, melhor.to, ele).length > 0;
      return R('nao_capturou', `Você não aproveitou ${oPeca(melhor.captured)} adversári${gen(melhor.captured, 'o', 'a')} em ${melhor.to}, que estava ${def ? 'mal defendid' + gen(melhor.captured, 'o', 'a') : 'sem defesa'}: ${mTxt} ganhava material.`);
    }
  }
  // 6) deixou passar um garfo
  if (melhor) {
    const gb = new Chess(c.fenAntes); gb.move(melhor.san);
    const gf = detectarGarfo(gb, melhor.to);
    if (gf) return R('tatica_perdida', `Você deixou passar um garfo: ${mTxt} atacava ${gf.alvos.map(a => oPeca(a.type)).join(' e ')} ao mesmo tempo.`);
  }
  // 7) rei exposto
  const direitos = c.fenAntes.split(' ')[2], meusDireitos = eu === 'w' ? /[KQ]/ : /[kq]/;
  if (m.piece === 'k' && !/[kq]/.test(m.flags) && meusDireitos.test(direitos))
    return R('rei_exposto', 'Você moveu o rei e perdeu o direito ao roque. No centro, o rei fica exposto aos ataques.' + fimMelhor);
  if (m.piece === 'p' && !m.captured) {
    const rei = casaDoRei(g0, eu);
    if (rei && rei[1] === (eu === 'w' ? '1' : '8') && (rei[0] >= 'f' || rei[0] <= 'c') && m.from[1] === (eu === 'w' ? '2' : '7') && Math.abs(rei.charCodeAt(0) - m.from.charCodeAt(0)) <= 1)
      return R('rei_exposto', 'Você avançou um peão do escudo do seu rei. Isso abre casas e linhas para o ataque adversário.' + fimMelhor);
  }
  if (resp && resp.san.indexOf('+') > 0 && c.perda >= 10)
    return R('rei_exposto', `Depois desse lance o seu rei ficou exposto: o adversário tem ${rTxt}, com xeque, e ganha vantagem.` + fimMelhor);
  // 8) perde material na sequência
  if (c.pvDepois && c.pvDepois.length) {
    const gp = new Chess(g1.fen()), m0 = materialDe(g1, eu);
    for (const u of c.pvDepois.slice(0, 4)) { if (!gp.move({ from: u.slice(0, 2), to: u.slice(2, 4), promotion: u[4] || undefined })) break; }
    const dif = m0 - materialDe(gp, eu);
    if (dif >= 1) return R('material', `Esse lance perde material: depois de ${rTxt || 'a melhor resposta'}, o adversário ganha ${dif === 1 ? 'um peão' : 'cerca de ' + dif + ' pontos'} na sequência.` + fimMelhor);
  }
  // 9) caso geral: descreve o que o melhor lance fazia
  if (m.piece === 'q' && +c.fenAntes.split(' ')[5] <= 7 && !m.captured)
    return R('posicional', 'Você saiu cedo demais com a dama. Ela vira alvo das peças adversárias, que se desenvolvem ganhando tempo enquanto você foge.' + fimMelhor);
  let desc = '';
  if (melhor) {
    if (/[kq]/.test(melhor.flags)) desc = `${mTxt} (roque) colocava o seu rei em segurança.`;
    else if (melhor.captured) desc = `${mTxt} capturava ${umPeca(melhor.captured)} em boas condições.`;
    else if (melhor.san.indexOf('+') > 0) desc = `${mTxt} dava xeque e mantinha a iniciativa.`;
    else if ((melhor.piece === 'n' || melhor.piece === 'b') && melhor.from[1] === (eu === 'w' ? '1' : '8')) desc = `${mTxt} desenvolvia mais uma peça.`;
    else if (melhor.piece === 'p' && /^[de][45]$/.test(melhor.to)) desc = `${mTxt} ocupava o centro.`;
    else desc = `${mTxt} deixava suas peças mais ativas.`;
  }
  return R('posicional', 'Havia um lance mais forte. ' + desc);
}

const Analise = {
  /* mostra o resultado, analisa todos os lances do jogador e abre o resumo */
  async iniciar(p) {

    catch (e) { r = { precisao: null, cont: { exc: 0, bom: 0, imp: 0, err: 0, gra: 0 }, itens: [], tags: {}, dicas: DICAS_GERAIS.slice(), fens: [], av: [], classe: {}, falhou: true }; }
    r.p = p;

  async analisar(p, progresso) {
    const g = new Chess(), fens = [g.fen()];
    for (const m of p.lances) { g.move(m.san); fens.push(g.fen()); }
    const N = p.lances.length, precisa = new Set();
    p.lances.forEach((m, i) => { if (m.color === p.cor) { precisa.add(i); precisa.add(i + 1); } });
    const lista = Array.from(precisa).sort((a, b) => a - b), av = new Array(N + 1).fill(null);
    let feitos = 0;
    for (const i of lista) {
      const gi = new Chess(fens[i]), vez = gi.turn(), s = vez === 'w' ? 1 : -1;
      if (gi.in_checkmate()) av[i] = { nota: -10000 * s, mate: null, best: null, pv: [] };
      else if (gi.game_over()) av[i] = { nota: 0, mate: null, best: null, pv: [] };
      else {
        const r = await Motor.analisar(fens[i], { depth: 12, movetime: 450, profSimples: 2 }) || { best: null, cp: 0, mate: null, pv: [] };
        av[i] = { nota: notaUnica(r) * s, mate: r.mate != null ? r.mate * s : null, best: r.best, pv: r.pv || [] };
      }
      progresso(++feitos / lista.length);
    }
    const itens = [], cont = { exc: 0, bom: 0, imp: 0, err: 0, gra: 0 }, tags = {}, classe = {};
    let soma = 0, n = 0;
    const s = p.cor === 'w' ? 1 : -1;
    p.lances.forEach((m, i) => {
      if (m.color !== p.cor) return;
      const a = av[i], d = av[i + 1];
      const notaA = a.nota * s, notaD = d.nota * s;
      const mateA = a.mate != null ? a.mate * s : null, mateD = d.mate != null ? d.mate * s : null;
      const jogouMelhor = !!a.best && uciDe(m) === a.best;
      const perda = jogouMelhor ? 0 : Math.max(0, chanceVitoria(notaA) - chanceVitoria(notaD));
      let cl = perda < 2 ? 'exc' : perda < 5 ? 'bom' : perda < 10 ? 'imp' : perda < 20 ? 'err' : 'gra';
      if (!jogouMelhor && mateA > 0 && mateA <= 3 && notaD < 9000 && (cl === 'exc' || cl === 'bom')) cl = 'imp';   // mate curto perdido
      if (!jogouMelhor && notaD < -9000 && notaA > -9000) cl = chanceVitoria(notaA) >= 20 ? 'gra' : (cl === 'gra' ? 'gra' : 'err'); // permitiu mate
      cont[cl]++; classe[i] = cl; n++;
      soma += jogouMelhor ? 100 : limita(103.1668 * Math.exp(-0.04354 * perda) - 3.1669, 0, 100);
      if (cl === 'imp' || cl === 'err' || cl === 'gra') {
        let ex;
        try { ex = explicarErro({ fenAntes: fens[i], lance: m, melhorUci: a.best, mateAntes: mateA, mateDepois: mateD, notaAntes: notaA, notaDepois: notaD, respUci: d.best, pvDepois: d.pv, perda }); }
        catch (e) { ex = { tag: 'posicional', texto: 'Havia um lance mais forte nesta posição.' }; }
        const gm = new Chess(fens[i]), mm = lanceDeUci(gm, a.best);
        itens.push({ i, num: Math.floor(i / 2) + 1, cor: m.color, san: m.san, de: m.from, para: m.to, classe: cl, melhor: mm ? mm.san : null, melhorUci: a.best, texto: ex.texto, tag: ex.tag });
        tags[ex.tag] = (tags[ex.tag] || 0) + 1;
      }
    });
    // 3 dicas personalizadas: as dos erros mais frequentes, completadas com dicas gerais
    const ordem = Object.keys(tags).sort((x, y) => tags[y] - tags[x]);
    const dicas = ordem.slice(0, 3).map(t => DICA_TAG[t]);
    for (const dg of DICAS_GERAIS) if (dicas.length < 3) dicas.push(dg);
    return { precisao: n ? soma / n : null, cont, itens, tags, dicas, fens, av, classe };
  },

/* ==========================================================================
   EXERCÍCIOS INTERATIVOS (usados nas fases e nos desafios táticos)
   criarExercicio(ex, host, cb) -> { dica(), solucao(), destruir(), temDica }
   cb: { msg(tipo, texto), passo(texto), erro(), resolvido() }
   ========================================================================== */

/* casas que uma peça sozinha alcança (exercícios de estrelas) */
function alvosPeca(tipo, casa, blocos) {
  const f = casa.charCodeAt(0) - 97, r = +casa[1] - 1, out = [];
  const add = (x, y) => { if (x < 0 || x > 7 || y < 0 || y > 7) return false; const s = nomeCasa(x, y); if (blocos.includes(s)) return false; out.push(s); return true; };
  const raio = d => { let x = f + d[0], y = r + d[1]; while (add(x, y)) { x += d[0]; y += d[1]; } };
  if (tipo === 'n') SALTOS.forEach(d => add(f + d[0], r + d[1]));
  else if (tipo === 'k') RETAS.concat(DIAGS).forEach(d => add(f + d[0], r + d[1]));
  else { if (tipo !== 'b') RETAS.forEach(raio); if (tipo !== 'r') DIAGS.forEach(raio); }
  return out;
}
/* caminho mais curto para coletar as estrelas que faltam (busca em largura). Devolve {n, primeiro} */
function caminhoEstrelas(tipo, de, estrelas, blocos) {
  const cheio = (1 << estrelas.length) - 1;
  if (!estrelas.length) return { n: 0, primeiro: null };
  const fila = [[de, 0, 0, null]], visto = new Set([de + '|0']);
  while (fila.length) {
    const [c, mask, d, prim] = fila.shift();
    if (mask === cheio) return { n: d, primeiro: prim };
    for (const t of alvosPeca(tipo, c, blocos)) {
      const i = estrelas.indexOf(t), m2 = i >= 0 ? mask | (1 << i) : mask, k = t + '|' + m2;
      if (!visto.has(k)) { visto.add(k); fila.push([t, m2, d + 1, prim || t]); }
    }
  }
  return { n: -1, primeiro: null };
}

function criarExercicio(ex, host, cb) {
  host.innerHTML = '';
  if (ex.t === 'quiz') return exQuiz(ex, host, cb);
  const linha = document.createElement('div'); linha.className = 'tab-linha'; host.appendChild(linha);
  return ex.t === 'stars' ? exEstrelas(ex, linha, cb) : exLances(ex, linha, cb);
}

/* ---------- pergunta de múltipla escolha ---------- */
function exQuiz(ex, host, cb) {
  if (ex.fen) {
    const linha = document.createElement('div'); linha.className = 'tab-linha'; linha.style.marginBottom = '12px'; host.appendChild(linha);
    const tab = new Tabuleiro(linha, { estatico: true }), g = new Chess(ex.fen);
    tab.orientar('w'); tab.posicionar(mapaDoJogo(g), false);
  }
  const cx = document.createElement('div'); cx.className = 'quiz';
  cx.innerHTML = ex.opts.map((o, i) => `<button class="bt" data-i="${i}">${esc(o)}</button>`).join('');
  host.appendChild(cx);
  let acabou = false;
  cx.onclick = e => {
    const b = e.target.closest('button'); if (!b || acabou || b.disabled) return;
    if (+b.dataset.i === ex.a) {
      acabou = true; b.classList.add('certa'); $$('button', cx).forEach(x => { if (x !== b) x.disabled = true; });
      cb.msg('ok', ex.ok); cb.resolvido();
    } else { b.classList.add('errada'); b.disabled = true; cb.msg('err', ex.err); cb.erro(); }
  };
  return { temDica: false, dica: () => false, solucao: () => { const b = $$('button', cx)[ex.a]; if (b && !acabou) b.click(); }, destruir() { acabou = true; } };
}

/* ---------- coletar estrelas com uma peça ---------- */
function exEstrelas(ex, linha, cb) {
  const blocos = ex.blocks || [], cod = 'w' + ex.piece.toUpperCase();
  let casa = ex.from, faltam = ex.stars.slice(), lances = 0, acabou = false;
  const par = caminhoEstrelas(ex.piece, ex.from, ex.stars, blocos).n;
  const tab = new Tabuleiro(linha, {
    alvos: c => (!acabou && c === casa) ? alvosPeca(ex.piece, casa, blocos) : null,
    mover: (de, para) => {
      casa = para; lances++; tab.setas([]);
      faltam = faltam.filter(s => s !== para);
      tab.posicionar({ [casa]: cod }); tab.marcar({ estrelas: faltam, ult: [de, para] });
      if (!faltam.length) {
        acabou = true;
        if (lances <= par) cb.msg('ok', `Perfeito! Você usou ${lances} lances, o mínimo possível.`);
        else { cb.erro(); cb.msg('ok', `Todas as estrelas coletadas em ${lances} lances. Dá para fazer em ${par} — tente de novo depois para ganhar 3 estrelas!`); }
        cb.resolvido();
      } else cb.msg('info', `Lances usados: ${lances} · mínimo possível: ${par} · estrelas restantes: ${faltam.length}`);
    }
  });
  tab.orientar('w'); tab.posicionar({ [casa]: cod }, false); tab.marcar({ estrelas: faltam, blocos });
  return {
    temDica: true,
    dica() { if (acabou) return false; const p = caminhoEstrelas(ex.piece, casa, faltam, blocos).primeiro; if (!p) return false; tab.setas([{ de: casa, para: p, cor: 'azul' }]); return true; },
    solucao() { }, destruir() { acabou = true; }
  };
}

/* ---------- sequência de lances (seq) e xeque-mate em n (mate) ---------- */
function exLances(ex, linha, cb) {
  const g = new Chess(ex.fen), ehMate = ex.t === 'mate', sol = ehMate ? ex.sol : ex.line;
  let travado = false, acabou = false, morto = false, idx = 0, restante = ex.n || 0, naLinha = true, jogador = g.turn();
  const item = i => Array.isArray(sol[i]) ? sol[i] : [sol[i]];
  const legal = san => { const m = g.move(san); if (m) g.undo(); return m; };
  const tab = new Tabuleiro(linha, {
    alvos: c => {
      if (travado || acabou || g.turn() !== jogador) return null;
      const p = g.get(c); if (!p || p.color !== jogador) return null;
      return Array.from(new Set(g.moves({ square: c, verbose: true }).map(m => m.to)));
    },
    promocao: (de, para) => { const p = g.get(de); return !!p && p.type === 'p' && (para[1] === '8' || para[1] === '1'); },
    mover
  });
  const atualizar = (m, animar = true) => { tab.posicionar(mapaDoJogo(g), animar); tab.marcar({ ult: m ? [m.from, m.to] : [], xq: g.in_check() ? casaDoRei(g, g.turn()) : null }); };
  const passo = () => { if (ex.steps && cb.passo) cb.passo(ex.steps[Math.floor(idx / 2)] || ''); };
  const concluir = () => { acabou = true; if (cb.passo) cb.passo(''); cb.msg('ok', ex.ok); cb.resolvido(); };
  async function responder(san) {
    travado = true; await espera(520); if (morto) return;
    const m = g.move(san); if (m) atualizar(m); travado = false;
  }
  function mover(de, para, promo) {
    if (travado || acabou) { tab.redesenhar(); return; }
    const m = g.move({ from: de, to: para, promotion: promo || 'q' });
    if (!m) { tab.redesenhar(); return; }
    tab.setas([]);
    const s = semSinal(m.san);
    let aceito = false, resposta = null;
    if (ehMate) {
      if (g.in_checkmate()) aceito = true;
      else if (!g.game_over() && restante > 1 && todasLevamAMate(g, restante - 1)) {
        aceito = true;
        if (naLinha && s === semSinal(sol[idx]) && legal(sol[idx + 1])) resposta = sol[idx + 1];
        else { naLinha = false; resposta = g.moves()[0]; }
      }
    } else aceito = ex.any || item(idx).some(a => semSinal(a) === s);
    if (!aceito) {
      const afogou = g.in_stalemate();
      g.undo(); tab.posicionar(mapaDoJogo(g), false); tab.redesenhar(); tab.piscarErro(para);
      cb.msg('err', (ex.wrong && ex.wrong[s]) || (afogou ? 'Afogamento! O rei adversário ficaria sem lances e sem estar em xeque: a partida empataria.' : ex.err));
      cb.erro(); return;
    }
    atualizar(m);
    if (ehMate) {
      if (g.in_checkmate()) return concluir();
      restante--; idx += 2;
      cb.msg('info', restante === 1 ? 'Muito bem! Agora dê o xeque-mate.' : 'Muito bem! Continue.');
      responder(resposta);
    } else {
      idx++;
      if (idx >= sol.length) return concluir();
      const r = item(idx).find(a => legal(a));
      cb.msg('info', 'Isso! Veja a resposta e continue.');
      responder(r).then(() => { if (morto) return; idx++; if (idx >= sol.length) concluir(); else passo(); });
    }
  }
  tab.orientar(ex.pre ? (jogador === 'w' ? 'b' : 'w') : jogador);
  atualizar(null, false);
  if (ex.pre) {            // lance do adversário antes de começar
    jogador = jogador === 'w' ? 'b' : 'w';
    responder(ex.pre);
  }
  passo();
  return {
    temDica: true,
    dica() {
      if (acabou || travado) return false;
      let san = null;
      if (ehMate) {
        if (naLinha) san = sol[idx];
        else san = g.moves().find(x => { if (x.endsWith('#')) return true; if (restante <= 1) return false; g.move(x); const ok = !g.game_over() && todasLevamAMate(g, restante - 1); g.undo(); return ok; });
      } else san = item(idx).find(a => legal(a));
      const m = san && legal(san); if (!m) return false;
      tab.setas([{ de: m.from, para: m.to, cor: 'azul' }]); return true;
    },
    async solucao() {       // mostra a solução completa, lance a lance
      acabou = true; travado = true; tab.limparSelecao(); tab.setas([]);
      g.load(ex.fen); if (ex.pre) g.move(ex.pre);
      atualizar(null, false);
      for (const it of sol) {
        await espera(750); if (morto) return;
        const m = g.move(Array.isArray(it) ? it[0] : it); if (!m) break;
        atualizar(m);
      }
    },
    destruir() { morto = true; acabou = true; }
  };
}

/* ==========================================================================
   APRENDER — caminho de fases com estrelas
   ========================================================================== */
const Aprender = {
  lista: null,
  todas() {
    if (!this.lista) { this.lista = []; MODULOS.forEach(m => m.fases.forEach(f => this.lista.push({ mod: m, fase: f }))); }
    return this.lista;
  },
  liberada(i) { return i === 0 || (Dados.d.fases[this.todas()[i - 1].fase.id] || 0) >= 1; },
  resumo() {
    const t = this.todas(); let feitas = 0, estrelas = 0;
    t.forEach(x => { const e = Dados.d.fases[x.fase.id] || 0; if (e) feitas++; estrelas += e; });
    return { feitas, total: t.length, estrelas, maxEstrelas: t.length * 3 };
  },
  htmlEstrelas(n) { return [1, 2, 3].map(i => `<span class="${i <= n ? 'on' : ''}">★</span>`).join(''); },

  telaLista() {
    const r = this.resumo();
    App.cabecalho('Aprender', 'menu', `${r.estrelas}/${r.maxEstrelas} ★`);
    let i = 0, h = `<div class="cartao"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px"><b>${r.feitas} de ${r.total} fases concluídas</b><span class="sub">Complete uma fase para liberar a próxima</span></div>
      <div class="progresso"><i style="width:${Math.round(r.feitas / r.total * 100)}%"></i></div></div>`;
    MODULOS.forEach((m, mi) => {
      h += `<section class="modulo"><header><h2>Módulo ${mi + 1} · ${m.nome}</h2><span>${m.desc}</span></header><div class="trilha">`;
      m.fases.forEach(f => {
        const e = Dados.d.fases[f.id] || 0, lib = this.liberada(i);
        h += `<button class="fase${lib ? '' : ' trancada'}${e ? ' feita' : ''}" data-id="${f.id}" ${lib ? '' : 'disabled aria-disabled="true"'}>
          <span class="num">${i + 1}</span><span class="pcf pcw">${pecaSvg(f.icone, 'w')}</span><b>${f.nome}</b><span class="est">${this.htmlEstrelas(e)}</span></button>`;
        i++;
      });
      h += '</div></section>';
    });
    $('#tela').innerHTML = h;
    $('#tela').onclick = e => { const b = e.target.closest('.fase'); if (b && !b.disabled) App.ir('fase', b.dataset.id); };
    App.aoSair = () => { $('#tela').onclick = null; };
  },

  telaFase(id) {
    const t = this.todas(), pos = t.findIndex(x => x.fase.id === id), fase = t[pos].fase, n = fase.ex.length;
    let i = -1, erros = 0, exAtual = null, penalizouDica = false;
    App.cabecalho(fase.nome, 'aprender', `Fase ${pos + 1}/${t.length}`);
    App.aoSair = () => { if (exAtual) exAtual.destruir(); };
    const intro = () => {
      $('#tela').innerHTML = `<div class="estreito pilha"><div class="cartao">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px"><span class="pcf pcw" style="width:52px;height:52px;flex:none">${pecaSvg(fase.icone, 'w')}</span>
        <div><h2 style="margin:0">${fase.nome}</h2><span class="sub">Módulo: ${t[pos].mod.nome}</span></div></div>
        <p class="intro">${fase.intro}</p></div>
        <button class="bt pri cheio" id="f-ini">Começar os exercícios (${n})</button></div>`;
      $('.pcf svg').style.cssText = 'width:100%;height:100%;fill:var(--pf);stroke:var(--ps);stroke-width:3.4;stroke-linejoin:round';
      $('#f-ini').onclick = () => proximo();

    const proximo = () => {
      if (exAtual) { exAtual.destruir(); exAtual = null; }

      if (i >= n) return fim();
      const ex = fase.ex[i];
      $('#tela').innerHTML = `<div class="exercicio">
        <div class="passos">${fase.ex.map((_, k) => `<i class="${k < i ? 'ok' : k === i ? 'at' : ''}"></i>`).join('')}</div>
        <div class="enunciado"><small>Exercício ${i + 1} de ${n}</small><span>${esc(ex.t === 'quiz' ? ex.q : ex.p)}</span><div class="sub" id="passo-txt" style="font-weight:600;color:var(--dest);margin-top:4px"></div></div>
        <div id="ex-host"></div>

        resolvido: () => { $('#b-cont').classList.remove('oculto'); $('#b-dica').classList.add('oculto'); }

        if (exAtual.dica()) { if (!penalizouDica) { penalizouDica = true; erros++; } ret.className = 'retorno info'; ret.textContent = 'Dica: siga a seta azul.'; }
      };
      $('#b-cont').onclick = () => proximo();
      window.scrollTo(0, 0);
    };
    const fim = () => {
      const est = erros === 0 ? 3 : erros <= 2 ? 2 : 1;
      const antes = Dados.d.fases[id] || 0;
      if (est > antes) { Dados.d.fases[id] = est; Dados.salvar(); }

        <div class="pilha">${prox ? `<button class="bt pri cheio" id="f-prox">Próxima fase: ${prox.fase.nome}</button>` : '<p><b>Você concluiu todas as fases. Parabéns!</b></p>'}
        <button class="bt cheio" id="f-rep">Repetir esta fase</button><button class="bt cheio" id="f-lista">Voltar às fases</button></div></div></div>`;
      if (prox) $('#f-prox').onclick = () => App.ir('fase', prox.fase.id);
      $('#f-rep').onclick = () => App.ir('fase', id);
      $('#f-lista').onclick = () => App.ir('aprender');
      window.scrollTo(0, 0);
    };
    intro();
  }
};

/* ==========================================================================
   DESAFIOS TÁTICOS — quebra-cabeças com pontuação
   ========================================================================== */
const Desafios = {
  faixa(r) { return r < 1000 ? 0 : r < 1300 ? 1 : 2; },
  NOMES: ['Fácil', 'Médio', 'Difícil'],
  tipo(k) { return k === 'm1' ? 'mate em 1' : k === 'm2' ? 'mate em 2' : 'ganho de material'; },
  enunciado(k) { return k === 'm1' ? 'Brancas jogam e dão xeque-mate em 1 lance.' : k === 'm2' ? 'Brancas jogam e dão xeque-mate em 2 lances.' : 'Brancas jogam e ganham material.'; },
  proximoId(atual) {
    const d = Dados.d.desafios, livres = PUZZLES.filter(p => !d.feitos[p.id] && p.id !== atual);
    if (!livres.length) { const outros = PUZZLES.filter(p => p.id !== atual); return sorteia(outros).id; }
    livres.sort((a, b) => Math.abs(a.r - d.pontos) - Math.abs(b.r - d.pontos) || a.id - b.id);
    return livres[0].id;
  },
  telaLista() {
    const d = Dados.d.desafios, feitos = Object.keys(d.feitos).length;
    App.cabecalho('Desafios táticos', 'menu');
    let h = `<div class="cartao" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <div><div class="sub">Sua pontuação</div><div class="pontos">${d.pontos}</div></div>
      <div style="flex:1;min-width:180px"><div class="sub" style="margin-bottom:6px">${feitos} de ${PUZZLES.length} desafios resolvidos</div><div class="progresso"><i style="width:${Math.round(feitos / PUZZLES.length * 100)}%"></i></div></div>
      <button class="bt pri" id="d-prox">Próximo desafio</button></div>
      <p class="sub" style="margin:10px 2px 0">A pontuação sobe quando você acerta de primeira e desce quando erra. Desafios difíceis valem mais.</p>`;
    [0, 1, 2].forEach(fx => {
      const lista = PUZZLES.filter(p => this.faixa(p.r) === fx);
      h += `<section class="modulo"><header><h2>${this.NOMES[fx]}</h2><span>${lista.length} desafios</span></header><div class="grade-des">` +
        lista.map(p => `<button class="des${d.feitos[p.id] === 1 ? ' ok1' : d.feitos[p.id] === 2 ? ' ok2' : ''}" data-id="${p.id}" title="${this.tipo(p.k)}"><span>${p.id}<small>${p.k === 'm1' ? 'MATE 1' : p.k === 'm2' ? 'MATE 2' : 'TÁTICA'}</small></span></button>`).join('') + '</div></section>';
    });
    $('#tela').innerHTML = h;
    $('#d-prox').onclick = () => App.ir('desafio', this.proximoId(0));
    $('#tela').onclick = e => { const b = e.target.closest('.des'); if (b) App.ir('desafio', +b.dataset.id); };
    App.aoSair = () => { $('#tela').onclick = null; };
  },
  /* explicação mostrada depois de resolver */
  explicar(p) {
    const l = p.line.map(sanPt);
    if (p.k === 'm1') return `${l[0]} é xeque-mate: o rei preto está em xeque e não pode fugir, bloquear nem capturar a peça que o ataca.`;
    if (p.k === 'm2') return `A chave é ${l[0]}. Depois de ${l[1]}, ${l[2]} é xeque-mate — e contra qualquer outra defesa das pretas também há mate no lance seguinte.`;
    const g0 = new Chess(p.fen), g = new Chess(p.fen), m = g.move(p.line[0]);
    let motivo;
    const gf = detectarGarfo(g, m.to);
    if (m.captured && ganhoDaCaptura(g0, lanceDeUci(g0, uciDe(m))) > 0)
      motivo = atacantes(g0, m.to, 'b').length === 0 ? `${oPeca(m.captured).replace(/^./, c => c.toUpperCase())} em ${m.to} estava sem defesa: bastava capturar.` : `${oPeca(m.captured).replace(/^./, c => c.toUpperCase())} em ${m.to} estava mal defendid${gen(m.captured, 'o', 'a')}: a captura ganha material.`;
    else if (gf) motivo = `É um garfo: ${oPeca(gf.peca)} ataca ${gf.alvos.map(a => oPeca(a.type)).join(' e ')} ao mesmo tempo.`;
    else if (m.san.indexOf('+') > 0) motivo = 'O xeque obriga as pretas a responder e, em seguida, as brancas ganham material.';
    else motivo = 'O lance cria ameaças que as pretas não conseguem defender ao mesmo tempo.';
    const cont = (p.cont || p.line).map(sanPt), partes = [];
    for (let i = 0; i < cont.length; i += 2) partes.push(`${i / 2 + 1}. ${cont[i]}${cont[i + 1] ? ' ' + cont[i + 1] : ''}`);
    return `A melhor jogada é ${l[0]}. ${motivo} Sequência principal: ${partes.join(' ')}. Resultado: cerca de ${p.g} ponto${p.g > 1 ? 's' : ''} de material a mais para as brancas.`;
  },
  telaDesafio(id) {
    const p = PUZZLES.find(x => x.id === id) || PUZZLES[0], d = Dados.d.desafios;
    const jaFeito = !!d.feitos[p.id];
    let errou = false, usouDica = false, resolvido = false, delta = 0;
    App.cabecalho('Desafio ' + p.id, 'desafios', `${d.pontos} pts`);
    const ex = p.k === 'w'
      ? { t: 'seq', fen: p.fen, line: p.line, ok: '', err: 'Não é a melhor jogada. Procure xeques, capturas e ameaças.' }
      : { t: 'mate', n: p.k === 'm1' ? 1 : 2, fen: p.fen, sol: p.line, ok: '', err: p.k === 'm1' ? 'Esse lance não dá xeque-mate. Procure outro xeque.' : 'Esse lance não força o mate em 2. Tente outro.' };
    $('#tela').innerHTML = `<div class="exercicio">
      <div class="enunciado"><small>${this.NOMES[this.faixa(p.r)]} · ${this.tipo(p.k)} · dificuldade ${p.r}${jaFeito ? ' · treino (já resolvido)' : ''}</small><span>${this.enunciado(p.k)}</span></div>
      <div id="ex-host"></div>
      <div class="retorno info" id="retorno">Encontre a melhor jogada das brancas.</div>
      <div class="fila"><button class="bt" id="b-dica">Dica</button><button class="bt" id="b-sol">Ver solução</button><button class="bt pri oculto" id="b-prox" style="flex:1">Próximo desafio</button></div>
      <div class="sub" id="d-pts">Pontuação: <b>${d.pontos}</b></div></div>`;
    const ret = $('#retorno');
    const pinta = () => {
      $('#d-pts').innerHTML = `Pontuação: <b>${d.pontos}</b>` + (delta ? ` <span class="delta ${delta > 0 ? 'mais' : 'menos'}">${delta > 0 ? '+' : '−'}${Math.abs(delta)}</span>` : '');
      $('#topo-lado').textContent = d.pontos + ' pts';
    };
    const esperado = 1 / (1 + Math.pow(10, (p.r - d.pontos) / 400));
    const perder = () => {                       // primeiro erro: a pontuação desce
      if (errou) return; errou = true;
      if (!jaFeito) { const q = Math.max(4, Math.round(24 * esperado)); delta -= q; d.pontos = Math.max(100, d.pontos - q); d.hist.push(d.pontos); if (d.hist.length > 120) d.hist = d.hist.slice(-120); Dados.salvar(); pinta(); }
    };
    const fechar = () => { $('#b-dica').classList.add('oculto'); $('#b-sol').classList.add('oculto'); $('#b-prox').classList.remove('oculto'); };
    const exe = criarExercicio(ex, $('#ex-host'), {
      msg: (tipo, txt) => { if (!txt) return; ret.className = 'retorno ' + tipo; ret.textContent = txt; },
      erro: perder,
      resolvido: () => {
        resolvido = true;
        if (!jaFeito) {
          if (!errou && !usouDica) { const q = Math.max(4, Math.round(24 * (1 - esperado))); delta += q; d.pontos += q; d.hist.push(d.pontos); d.feitos[p.id] = 1; }
          else d.feitos[p.id] = 2;
          if (d.hist.length > 120) d.hist = d.hist.slice(-120);
          Dados.salvar();
        }
        ret.className = 'retorno ok';
        ret.innerHTML = `<b>${errou ? 'Resolvido!' : usouDica ? 'Resolvido com dica.' : 'Correto, de primeira!'}</b> ${esc(this.explicar(p))}`;
        pinta(); fechar();
      }
    });
    App.aoSair = () => exe.destruir();
    $('#b-dica').onclick = () => { if (exe.dica()) { usouDica = true; ret.className = 'retorno info'; ret.textContent = 'Dica: siga a seta azul. (Com dica, o desafio não soma pontos.)'; } };
    $('#b-sol').onclick = () => {
      if (resolvido) return;
      perder(); resolvido = true;
      if (!jaFeito) { d.feitos[p.id] = 2; Dados.salvar(); }
      exe.solucao();
      ret.className = 'retorno info'; ret.innerHTML = `<b>Solução:</b> ${esc(this.explicar(p))}`;
      fechar();
    };
    $('#b-prox').onclick = () => App.ir('desafio', this.proximoId(p.id));
  }
};

/* ==========================================================================
   APP — navegação entre telas, menu inicial e estatísticas
   ========================================================================== */
const App = {
  atual: null, aoSair: null, voltarPara: null, empilhado: false, ignorarPop: false,

  cabecalho(titulo, voltar, lado) {
    $('#titulo').textContent = titulo;
    this.voltarPara = voltar || null;
    $('#voltar').classList.toggle('oculto', !voltar);
    $('#topo-lado').textContent = lado || '';
  },
  voltar() {
    if (!$('#modal').classList.contains('oculto')) return;      // há uma janela aberta
    const v = this.voltarPara;
    if (typeof v === 'function') v(); else if (v) this.ir(v);
  },
  /* troca de tela */
  ir(tela, param) {
    if (this.aoSair) { try { this.aoSair(); } catch (e) { /* ignora */ } this.aoSair = null; }
    Motor.aoMudar = null;
    this.atual = tela;
    // o botão "voltar" do celular/navegador volta para a tela anterior em vez de fechar o app
    try {
      if (tela !== 'menu' && !this.empilhado) { history.pushState({ x: 1 }, ''); this.empilhado = true; }
      else if (tela === 'menu' && this.empilhado) { this.empilhado = false; this.ignorarPop = true; history.back(); }
    } catch (e) { /* histórico indisponível */ }
    window.scrollTo(0, 0);
    switch (tela) {
      case 'config': Partida.telaConfig(); break;
      case 'jogo': Partida.iniciar(); break;
      case 'resumo': Analise.telaResumo(param); break;
      case 'aprender': Aprender.telaLista(); break;
      case 'fase': Aprender.telaFase(param); break;
      case 'desafios': Desafios.telaLista(); break;
      case 'desafio': Desafios.telaDesafio(param); break;
      case 'stats': Estatisticas.tela(); break;
      default: this.atual = 'menu'; telaMenu();
    }
  }
};
$('#voltar').onclick = () => App.voltar();
window.addEventListener('popstate', () => {
  if (App.ignorarPop) { App.ignorarPop = false; return; }
  App.empilhado = false;
  if (App.atual !== 'menu') {
    App.voltar();
    if (App.atual !== 'menu' && !App.empilhado) { try { history.pushState({ x: 1 }, ''); App.empilhado = true; } catch (e) { /* ignora */ } }
  }
});

/* ---------- estatísticas ---------- */
const Estatisticas = {
  grafico(vals) {
    if (vals.length < 2) return '<p class="sub">Jogue pelo menos duas partidas para ver o gráfico de evolução.</p>';
    const W = 600, H = 190, ml = 34, mr = 10, mt = 10, mb = 22, n = vals.length;
    const x = i => ml + (W - ml - mr) * (n === 1 ? .5 : i / (n - 1)), y = v => mt + (H - mt - mb) * (1 - v / 100);
    let h = `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Precisão das últimas partidas">`;
    [0, 25, 50, 75, 100].forEach(v => { h += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="#303848" stroke-width="1"/><text x="${ml - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#9aa4b6">${v}%</text>`; });
    const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    h += `<polygon points="${x(0)},${y(0)} ${pts} ${x(n - 1)},${y(0)}" fill="rgba(240,180,65,.12)"/><polyline points="${pts}" fill="none" stroke="#f0b441" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    vals.forEach((v, i) => { h += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" fill="#f0b441"><title>Partida ${i + 1}: ${v}%</title></circle>`; });
    h += `<text x="${ml}" y="${H - 5}" font-size="11" fill="#9aa4b6">mais antiga</text><text x="${W - mr}" y="${H - 5}" font-size="11" fill="#9aa4b6" text-anchor="end">mais recente</text></svg>`;
    return h;
  },
  tela() {
    App.cabecalho('Minhas estatísticas', 'menu');
    const d = Dados.d, tot = { v: 0, e: 0, d: 0 };
    d.porNivel.forEach(n => { tot.v += n.v; tot.e += n.e; tot.d += n.d; });
    const jogos = tot.v + tot.e + tot.d;
    const comPrec = d.partidas.filter(p => p.prec != null), ult10 = comPrec.slice(-10), ult20 = comPrec.slice(-20);
    const media = ult10.length ? Math.round(ult10.reduce((s, p) => s + p.prec, 0) / ult10.length) : null;
    const tags = Object.keys(d.tags).filter(t => d.tags[t] > 0).sort((a, b) => d.tags[b] - d.tags[a]), maxTag = tags.length ? d.tags[tags[0]] : 1;
    const ra = Aprender.resumo(), feitos = Object.keys(d.desafios.feitos).length;
    $('#tela').innerHTML = `<div class="pilha">
      <div class="numeros">
        <div class="numero"><b>${jogos}</b><span>Partidas jogadas</span></div>
        <div class="numero"><b style="color:var(--ok)">${tot.v}</b><span>Vitórias</span></div>
        <div class="numero"><b>${tot.e}</b><span>Empates</span></div>
        <div class="numero"><b style="color:var(--ruim)">${tot.d}</b><span>Derrotas</span></div>
      </div>
      <div class="duas">
        <div class="cartao"><h3>Resultados por nível</h3><table class="tb"><thead><tr><th>Nível</th><th>Partidas</th><th>Vitórias</th><th>Empates</th><th>Derrotas</th></tr></thead><tbody>
          ${NIVEIS.map((n, i) => { const x = d.porNivel[i]; return `<tr><td>${n.nome}</td><td>${x.v + x.e + x.d}</td><td>${x.v}</td><td>${x.e}</td><td>${x.d}</td></tr>`; }).join('')}</tbody></table></div>
        <div class="cartao"><h3>Precisão</h3>
          <p style="margin-bottom:8px">${media == null ? '<span class="sub">Ainda sem partidas analisadas.</span>' : `${ult10.length > 1 ? 'Média das últimas ' + ult10.length + ' partidas' : 'Precisão da sua partida'}: <b style="font-size:1.4rem;color:var(--dest)">${media}%</b>`}</p>
          ${this.grafico(ult20.map(p => p.prec))}</div>
      </div>
      <div class="duas">
        <div class="cartao"><h3>Seus erros mais comuns</h3>
          ${tags.length ? tags.slice(0, 6).map(t => `<div class="barra-h"><span>${ROTULO_TAG[t] || t}</span><div class="tr"><i style="width:${Math.round(d.tags[t] / maxTag * 100)}%"></i></div><b>${d.tags[t]}</b></div>`).join('') + `<p class="sub" style="margin-top:10px">${DICA_TAG[tags[0]] || ''}</p>`
        : '<p class="sub">Depois das suas partidas, os tipos de erro mais frequentes aparecem aqui.</p>'}</div>
        <div class="cartao"><h3>Estudo</h3>
          <div class="barra-h"><span>Fases concluídas</span><div class="tr"><i style="width:${Math.round(ra.feitas / ra.total * 100)}%;background:var(--ok)"></i></div><b>${ra.feitas}</b></div>
          <div class="barra-h"><span>Estrelas</span><div class="tr"><i style="width:${Math.round(ra.estrelas / ra.maxEstrelas * 100)}%;background:var(--dest)"></i></div><b>${ra.estrelas}</b></div>
          <div class="barra-h"><span>Desafios resolvidos</span><div class="tr"><i style="width:${Math.round(feitos / PUZZLES.length * 100)}%;background:var(--info)"></i></div><b>${feitos}</b></div>
          <p style="margin-top:10px">Pontuação nos desafios: <b style="color:var(--dest)">${d.desafios.pontos}</b></p></div>
      </div>
      <div class="cartao" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div><b>Zerar progresso</b><div class="sub">Apaga fases, pontuação, histórico e estatísticas deste aparelho.</div></div>
        <button class="bt perigo" id="zerar">Zerar tudo</button></div></div>`;
    $('#zerar').onclick = async () => {
      const ok = await modal('Zerar todo o progresso?', 'Fases concluídas, estrelas, pontuação dos desafios, histórico de partidas e estatísticas serão apagados. Não dá para desfazer.', [{ txt: 'Cancelar', val: false }, { txt: 'Sim, zerar tudo', cls: 'perigo', val: true }]);
      if (!ok) return;
      Dados.zerar(); aviso('Progresso zerado.'); this.tela();
    };
  }
};

/* ---------- inicialização ---------- */
(async function iniciarApp() {
  Dados.carregar();
  $('#tela').innerHTML = '<div class="capa"><p>Carregando…</p></div>';
  const ok = await carregarChess();
  if (!ok) {
    $('#tela').innerHTML = `<div class="estreito"><div class="cartao final"><h2>Não foi possível carregar o jogo</h2>
      <p class="sub" style="margin:8px 0 16px">O trainer precisa baixar a biblioteca de regras (chess.js) da internet na primeira abertura. Verifique a conexão e tente de novo.</p>
      <button class="bt pri" id="recarregar">Tentar de novo</button></div></div>`;
    $('#recarregar').onclick = () => location.reload();
    return;
  }
  Motor.iniciar();          // carrega o Stockfish em paralelo; enquanto isso o motor reserva responde
  App.ir('menu');
})();

</script>
</body>
</html>
