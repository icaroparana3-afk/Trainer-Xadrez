<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11141a">
<title>Trainer de Xadrez</title>
<meta name="description" content="Trainer de xadrez gratuito: jogue contra o computador, aprenda por fases, resolva desafios táticos e veja a análise dos seus erros.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2311141a'/%3E%3Cpath d='M34 80c0-14 12-20 10-32-4 4-10 10-16 10-4 2-9-1-10-6-1-4 2-7 4-10l12-16c1-4 1-8 2-12l8 6c16-2 34 12 34 38v22z' fill='%23f0b441'/%3E%3C/svg%3E">
<style>
/* ============================ TEMA E BASE ============================ */
:root{
  --fundo:#11141a; --sup:#1a1f28; --sup2:#232a36; --linha:#303848;
  --txt:#e9ecf2; --txt2:#9aa4b6; --dest:#f0b441; --dest-tinta:#1b1404;
  --ok:#5ecb8a; --ruim:#ef6a6a; --alerta:#f29f4b; --info:#62a8f5;
  --casa-clara:#ebe6d6; --casa-escura:#6b8f71;
  --raio:14px; --tab:min(calc(100vw - 56px), calc(100dvh - 250px), 600px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--fundo);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3,p{margin:0}
.oculto{display:none!important}
#app{min-height:100%;display:flex;flex-direction:column}

/* ---------- barra superior ---------- */
#topo{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;height:56px;padding:0 10px;
  background:rgba(17,20,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
#topo h1{flex:1;font-size:1.05rem;font-weight:650;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#voltar{width:44px;height:44px;border-radius:12px;font-size:1.4rem;display:grid;place-items:center;color:var(--txt2)}
#voltar:hover{background:var(--sup2);color:var(--txt)}
#topo .lado{font-size:.82rem;color:var(--txt2);padding-right:6px;white-space:nowrap}
#tela{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:16px 12px 40px}

/* ---------- botões ---------- */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;
  background:var(--sup2);border:1px solid var(--linha);font-weight:600;font-size:.98rem;transition:background .15s,transform .05s,border-color .15s;user-select:none}
.bt:hover{background:#2b3342}
.bt:active{transform:translateY(1px)}
.bt.pri{background:var(--dest);color:var(--dest-tinta);border-color:transparent}
.bt.pri:hover{background:#f6c25c}
.bt.perigo{color:var(--ruim);border-color:#5a2f33}
.bt.peq{min-height:40px;padding:6px 12px;font-size:.9rem}
.bt[disabled]{opacity:.45;pointer-events:none}
.bt.cheio{width:100%}
.fila{display:flex;flex-wrap:wrap;gap:8px}
.fila.centro{justify-content:center}

/* ---------- cartões ---------- */
.cartao{background:var(--sup);border:1px solid var(--linha);border-radius:var(--raio);padding:16px}
.cartao h2{font-size:1.05rem;margin-bottom:8px}
.cartao h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--txt2);margin-bottom:10px;font-weight:650}
.sub{color:var(--txt2);font-size:.92rem}
.pilha{display:grid;gap:12px}

/* ============================ MENU ============================ */
.capa{text-align:center;padding:18px 0 8px}
.capa .logo{width:72px;height:72px;margin:0 auto 6px;display:block}
.capa h2{font-size:1.7rem;letter-spacing:-.01em}
.capa p{color:var(--txt2)}
.menu{display:grid;gap:12px;grid-template-columns:1fr;max-width:720px;margin:18px auto 0}
@media(min-width:640px){.menu{grid-template-columns:1fr 1fr}}
.item-menu{display:flex;align-items:center;gap:14px;text-align:left;padding:18px;border-radius:var(--raio);background:var(--sup);
  border:1px solid var(--linha);min-height:92px;transition:border-color .15s,background .15s,transform .08s}
.item-menu:hover{border-color:var(--dest);background:#1e2430}
.item-menu:active{transform:scale(.99)}
.item-menu .ic{flex:none;width:54px;height:54px;border-radius:14px;background:var(--sup2);display:grid;place-items:center}
.item-menu .ic svg{width:46px;height:46px}
.item-menu b{display:block;font-size:1.08rem;color:var(--txt)}
.item-menu span{color:var(--txt2);font-size:.88rem}
.rodape{margin-top:22px;text-align:center;color:var(--txt2);font-size:.8rem}
.ponto{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--alerta);margin-right:6px;vertical-align:middle}
.ponto.ok{background:var(--ok)}

/* ============================ TABULEIRO ============================ */
.tab-linha{display:flex;gap:8px;justify-content:center;align-items:stretch}
.tabuleiro{position:relative;width:var(--tab);height:var(--tab);flex:none;border-radius:8px;overflow:hidden;touch-action:none;user-select:none;
  -webkit-user-select:none;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06)}
.tabuleiro.estatico{touch-action:auto;pointer-events:none}
.tabuleiro .casas{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.casa{position:relative;background:var(--casa-clara)}
.casa.e{background:var(--casa-escura)}
.casa .co{position:absolute;font-size:clamp(8px,calc(var(--tab) / 46),12px);font-weight:700;line-height:1;opacity:.75;pointer-events:none;color:var(--casa-escura)}
.casa.e .co{color:var(--casa-clara)}
.casa .co.n{left:3px;top:3px}
.casa .co.l{right:3px;bottom:2px}
.casa.ult{box-shadow:inset 0 0 0 100px rgba(244,205,80,.42)}
.casa.sel{box-shadow:inset 0 0 0 100px rgba(240,180,65,.62)}
.casa.xq{background-image:radial-gradient(circle at 50% 50%,rgba(239,68,68,.95) 0,rgba(239,68,68,.55) 45%,rgba(239,68,68,0) 78%)}
.casa.mal{box-shadow:inset 0 0 0 100px rgba(239,90,90,.6)}
.casa.pt::after{content:"";position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:rgba(17,24,20,.3)}
.casa.cap::after{content:"";position:absolute;inset:5%;border-radius:50%;border:calc(var(--tab) / 110) solid rgba(17,24,20,.32)}
.casa.estrela::before{content:"★";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--tab) / 12);color:#f5b82e;
  text-shadow:0 2px 0 rgba(0,0,0,.35);animation:pulsa 1.4s ease-in-out infinite}
.casa.bloco{box-shadow:inset 0 0 0 100px rgba(0,0,0,.25)}
@keyframes pulsa{50%{transform:scale(1.14)}}
.tabuleiro .pecas{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .2s cubic-bezier(.2,.7,.3,1),opacity .2s;will-change:transform}
.pc svg{width:100%;height:100%;display:block;stroke-linejoin:round;stroke-linecap:round;fill:var(--pf);stroke:var(--ps);stroke-width:3.4;
  filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.28))}
.pc.w,.pcw{--pf:#fbfaf4;--ps:#33363d;--pd:#33363d}
.pc.b,.pcb{--pf:#3a3e47;--ps:#121418;--pd:#c7cdd8}
.pc.arr{transition:none;z-index:5}
.pc.nova{opacity:0}
.sem-anim .pc{transition:none}
.det{fill:none;stroke:var(--pd);stroke-width:2.6}
.detf{fill:var(--pd);stroke:none}
.tabuleiro svg.setas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.promo{position:absolute;inset:0;background:rgba(10,12,16,.55);display:grid;place-items:center;z-index:8}
.promo .cx{background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:10px;display:flex;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.promo button{width:calc(var(--tab) / 6.2);max-width:76px;aspect-ratio:1;border-radius:10px;background:var(--sup2);padding:4px}
.promo button:hover{background:var(--dest)}
.promo button svg{width:100%;height:100%;stroke-linejoin:round;fill:var(--pf);stroke:var(--ps);stroke-width:3.4}
.treme{animation:treme .3s}
@keyframes treme{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* barra de avaliação */
.barra-av{position:relative;width:22px;flex:none;border-radius:6px;overflow:hidden;background:#2d3139;border:1px solid var(--linha)}
.barra-av i{position:absolute;left:0;right:0;bottom:0;background:#f1efe8;height:50%;transition:height .5s ease}
.barra-av.inv i{bottom:auto;top:0}
.barra-av span{position:absolute;left:0;right:0;text-align:center;font-size:8.5px;font-weight:700;color:#8a93a3;bottom:3px;mix-blend-mode:difference;letter-spacing:-.03em}

/* ============================ PARTIDA ============================ */
.jogo{display:grid;gap:14px;grid-template-columns:1fr;justify-items:center}
.jogo .col-tab{display:grid;gap:8px;justify-items:stretch;width:calc(var(--tab) + 30px)}
.jogo .lateral{width:100%;max-width:calc(var(--tab) + 30px);display:grid;gap:12px;align-content:start}
@media(min-width:960px){
  .jogo{grid-template-columns:auto minmax(280px,360px);align-items:start;justify-content:center}
  .jogo .lateral{max-width:none}
}
.jogador{display:flex;align-items:center;gap:10px;padding:2px 2px 2px 30px;min-height:34px}
.jogador .nome{flex:1;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jogador .nome small{color:var(--txt2);font-weight:500;margin-left:6px}
.relogio{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;padding:3px 10px;border-radius:8px;background:var(--sup2);border:1px solid var(--linha);min-width:70px;text-align:center}
.relogio.ativo{background:#f1efe8;color:#14171c;border-color:transparent}
.relogio.baixo.ativo{background:var(--ruim);color:#fff}
.pensando{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}
.pensando i{width:5px;height:5px;border-radius:50%;background:var(--dest);animation:pisca 1s infinite}
.pensando i:nth-child(2){animation-delay:.15s}.pensando i:nth-child(3){animation-delay:.3s}
@keyframes pisca{0%,80%,100%{opacity:.25}40%{opacity:1}}
.controles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.controles .bt{flex-direction:column;gap:2px;padding:6px 2px;font-size:.72rem;min-height:56px;font-weight:600}
.controles .bt svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lances{max-height:220px;overflow:auto;display:grid;grid-template-columns:38px 1fr 1fr;gap:2px 4px;font-variant-numeric:tabular-nums;font-size:.95rem;align-content:start}
@media(min-width:960px){.lances{max-height:380px}}
.lances .n{color:var(--txt2);text-align:right;padding:3px 6px 3px 0}
.lances .l{padding:3px 8px;border-radius:6px;font-weight:600}
.lances button.l{text-align:left}
.lances button.l:hover{background:var(--sup2)}
.lances .l.atual{background:var(--dest);color:var(--dest-tinta)}
.lances .vazio{grid-column:1/-1;color:var(--txt2);font-size:.9rem;padding:6px 0}
.status{font-size:.95rem;min-height:1.5em}

/* opções (configuração da partida) */
.opcoes{display:grid;gap:8px}
.opcoes.c3{grid-template-columns:repeat(3,1fr)}
.opcoes.c2{grid-template-columns:repeat(2,1fr)}
@media(min-width:560px){.opcoes.c6{grid-template-columns:repeat(3,1fr)}}
.opcoes.c6{grid-template-columns:repeat(2,1fr)}
.op{min-height:54px;border-radius:12px;background:var(--sup2);border:2px solid transparent;padding:8px 10px;font-weight:600;text-align:center;line-height:1.25}
.op small{display:block;font-weight:500;color:var(--txt2);font-size:.76rem}
.op.on{border-color:var(--dest);background:#2c2a22}
.estreito{max-width:640px;margin:0 auto}

/* ============================ RESUMO / ANÁLISE ============================ */
.placar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.roda{--p:0;width:104px;height:104px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--dest) calc(var(--p)*1%),var(--sup2) 0)}
.roda div{width:82px;height:82px;border-radius:50%;background:var(--sup);display:grid;place-items:center;text-align:center;line-height:1.1}
.roda b{font-size:1.5rem}
.roda small{display:block;color:var(--txt2);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--sup2);font-size:.85rem;font-weight:600}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,#888)}
.c-exc{--c:#4cc2a0}.c-bom{--c:#8fc46a}.c-imp{--c:#e8c04a}.c-err{--c:#f0914a}.c-gra{--c:#ef5a5a}
.erro-item{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--sup2);border:1px solid transparent;border-left:4px solid var(--c)}
.erro-item:hover,.erro-item.on{border-color:var(--c)}
.erro-item .cab{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.erro-item .cab b{font-size:1rem}
.erro-item .cab span{font-size:.78rem;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.05em}
.erro-item p{font-size:.92rem;color:#cfd5df;margin-top:4px}
.erro-item .melhor{color:var(--ok);font-weight:600;font-size:.9rem;margin-top:4px}
.dica-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--linha)}
.dica-item:first-of-type{border-top:0}
.dica-item .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--dest);color:var(--dest-tinta);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.nav-rev{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nav-rev .bt{font-size:1.15rem;padding:6px}
.info-rev{min-height:3.2em;font-size:.93rem}
.info-rev b.tag{color:var(--c)}
.progresso{height:10px;border-radius:999px;background:var(--sup2);overflow:hidden}
.progresso i{display:block;height:100%;width:0;background:var(--dest);border-radius:999px;transition:width .25s}

/* ============================ APRENDER ============================ */
.modulo{margin-top:18px}
.modulo>header{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.modulo>header h2{font-size:1.02rem}
.modulo>header span{color:var(--txt2);font-size:.85rem}
.trilha{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fase{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px 12px;border-radius:var(--raio);background:var(--sup);
  border:1px solid var(--linha);text-align:center;min-height:128px;transition:border-color .15s,transform .08s}
.fase:hover{border-color:var(--dest)}
.fase .pcf{width:46px;height:46px}
.fase .pcf svg{width:100%;height:100%;fill:var(--pf);stroke:var(--ps);stroke-width:3.4;stroke-linejoin:round}
.fase b{font-size:.92rem;line-height:1.2}
.fase .est{font-size:1rem;letter-spacing:2px;color:#4a5263}
.fase .est .on{color:var(--dest)}
.fase.trancada{opacity:.45;pointer-events:none}
.fase.trancada::after{content:"🔒";position:absolute;top:8px;right:10px;font-size:.9rem}
.fase.feita{border-color:#3d5a48}
.fase .num{position:absolute;top:8px;left:10px;font-size:.72rem;color:var(--txt2);font-weight:700}
.exercicio{display:grid;gap:12px;justify-items:center}
.exercicio>*{width:100%;max-width:calc(var(--tab) + 0px)}
.exercicio .tab-linha{max-width:none}
.passos{display:flex;gap:5px}
.passos i{flex:1;height:6px;border-radius:999px;background:var(--sup2)}
.passos i.ok{background:var(--ok)}
.passos i.at{background:var(--dest)}
.enunciado{font-size:1.02rem;font-weight:600;line-height:1.4}
.enunciado small{display:block;color:var(--txt2);font-weight:500;font-size:.82rem;margin-bottom:2px;text-transform:uppercase;letter-spacing:.06em}
.retorno{padding:12px 14px;border-radius:12px;font-size:.95rem;background:var(--sup2);border-left:4px solid var(--txt2);min-height:48px}
.retorno.ok{border-color:var(--ok);background:#1c2a23}
.retorno.err{border-color:var(--ruim);background:#2b1e21}
.retorno.info{border-color:var(--info)}
.quiz{display:grid;gap:8px}
.quiz .bt{justify-content:flex-start;text-align:left;font-weight:500;line-height:1.35}
.quiz .bt.certa{background:#1f3a2b;border-color:var(--ok)}
.quiz .bt.errada{background:#3a2226;border-color:var(--ruim)}
.intro{font-size:1rem;line-height:1.6}
.intro b{color:var(--dest)}
.final{text-align:center;padding:26px 16px}
.final .est-g{font-size:2.6rem;letter-spacing:6px;color:#4a5263;margin:6px 0}
.final .est-g .on{color:var(--dest)}

/* ============================ DESAFIOS ============================ */
.grade-des{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.des{position:relative;aspect-ratio:1;border-radius:12px;background:var(--sup2);border:1px solid var(--linha);display:grid;place-items:center;font-weight:700;line-height:1.1;text-align:center}
.des small{display:block;font-size:.62rem;color:var(--txt2);font-weight:600;letter-spacing:.04em}
.des:hover{border-color:var(--dest)}
.des.ok1{background:#1f3a2b;border-color:#3d6b50}
.des.ok2{background:#33301f;border-color:#6b6238}
.des.ok1::after,.des.ok2::after{content:"✓";position:absolute;top:3px;right:6px;font-size:.72rem;color:var(--ok)}
.pontos{font-size:2rem;font-weight:800;color:var(--dest);line-height:1}
.delta{font-weight:700}.delta.mais{color:var(--ok)}.delta.menos{color:var(--ruim)}

/* ============================ ESTATÍSTICAS ============================ */
.numeros{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.numeros{grid-template-columns:repeat(4,1fr)}}
.numero{background:var(--sup);border:1px solid var(--linha);border-radius:var(--raio);padding:14px;text-align:center}
.numero b{display:block;font-size:1.7rem;line-height:1.1}
.numero span{color:var(--txt2);font-size:.82rem}
table.tb{width:100%;border-collapse:collapse;font-size:.93rem}
.tb th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--txt2);text-align:right;padding:6px 8px;font-weight:650}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb td{padding:8px;border-top:1px solid var(--linha);text-align:right;font-variant-numeric:tabular-nums}
.barra-h{display:grid;grid-template-columns:minmax(120px,1fr) 2fr 34px;gap:10px;align-items:center;font-size:.9rem;padding:5px 0}
.barra-h .tr{height:10px;border-radius:999px;background:var(--sup2);overflow:hidden}
.barra-h .tr i{display:block;height:100%;background:var(--alerta);border-radius:999px}
.barra-h b{text-align:right;font-variant-numeric:tabular-nums}
.grafico{width:100%;height:auto;display:block}
.duas{display:grid;gap:12px}
@media(min-width:800px){.duas{grid-template-columns:1fr 1fr}}

/* ============================ MODAL / AVISO ============================ */
#modal{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.66);display:grid;place-items:center;padding:16px}
#modal .cx{width:100%;max-width:420px;background:var(--sup);border:1px solid var(--linha);border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center}
#modal h2{font-size:1.25rem;margin-bottom:6px}
#modal p{color:#cfd5df;margin-bottom:16px}
#modal .fila{justify-content:center}
#modal .fila .bt{flex:1;min-width:120px}
#aviso{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:#f1efe8;color:#14171c;font-weight:600;padding:10px 16px;border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100vw - 32px);text-align:center;transition:opacity .25s;font-size:.93rem}
#aviso.oculto{display:block!important;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* evita rolagem lateral em telas estreitas */

<script>
/* ==========================================================================
   TRAINER DE XADREZ — núcleo: utilidades, armazenamento, notação,
   funções auxiliares de xadrez e motores (Stockfish + motor reserva)
   ========================================================================== */
'use strict';

/* ---------- utilidades de página ---------- */
const $ = (s, raiz = document) => raiz.querySelector(s);
const $$ = (s, raiz = document) => Array.from(raiz.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const espera = ms => new Promise(r => setTimeout(r, ms));
const limita = (x, a, b) => Math.max(a, Math.min(b, x));
const pecaSvg = (tipo, cor) => `<svg viewBox="0 0 100 100" class="pc${cor}"><use href="#pc-${tipo}"/></svg>`;

/* aviso rápido na parte de baixo da tela */
let avisoTimer = null;
function aviso(texto, ms = 2600) {
  const a = $('#aviso'); a.textContent = texto; a.classList.remove('oculto');
  clearTimeout(avisoTimer); avisoTimer = setTimeout(() => a.classList.add('oculto'), ms);
}

/* janela de confirmação / mensagem. botoes: [{txt, cls, val}] -> Promise(val) */
function modal(titulo, texto, botoes) {
  return new Promise(res => {
    const m = $('#modal');
    m.innerHTML = `<div class="cx" role="dialog" aria-modal="true"><h2>${titulo}</h2><p>${texto}</p>
      <div class="fila">${botoes.map((b, i) => `<button class="bt ${b.cls || ''}" data-i="${i}">${b.txt}</button>`).join('')}</div></div>`;
    m.classList.remove('oculto');

      m.classList.add('oculto'); m.innerHTML = ''; m.onclick = null; res(botoes[+b.dataset.i].val);
    };

}
function fecharModal() { const m = $('#modal'); m.classList.add('oculto'); m.innerHTML = ''; m.onclick = null; }

/* ---------- armazenamento local (sempre com try/catch) ---------- */
const Dados = {
  CHAVE: 'trainer-xadrez-v1',
  d: null,
  padrao() {
    return {
      v: 1,
      fases: {},                                   // id da fase -> estrelas (1 a 3)
      desafios: { pontos: 800, feitos: {}, hist: [800] }, // feitos: id -> 1 (de primeira) ou 2 (com erro/dica)
      partidas: [],                                // histórico (até 60)
      porNivel: [0, 1, 2, 3, 4, 5].map(() => ({ v: 0, e: 0, d: 0 })),
      tags: {},                                    // tipo de erro -> quantidade
      cfg: { nivel: 1, cor: 'w', relogio: 0 }
    };
  },
  carregar() {
    const p = this.padrao();
    try {
      const bruto = localStorage.getItem(this.CHAVE);
      if (bruto) {
        const o = JSON.parse(bruto);
        if (o && typeof o === 'object') {
          Object.assign(p, o);
          p.desafios = Object.assign(this.padrao().desafios, o.desafios || {});
          p.cfg = Object.assign(this.padrao().cfg, o.cfg || {});
          if (!Array.isArray(p.porNivel) || p.porNivel.length !== 6) p.porNivel = this.padrao().porNivel;
          if (!Array.isArray(p.partidas)) p.partidas = [];
        }
      }
    } catch (e) { /* armazenamento indisponível ou dado corrompido: segue com o padrão */ }
    this.d = p;
  },
  salvar() {
    try { localStorage.setItem(this.CHAVE, JSON.stringify(this.d)); } catch (e) { /* modo privado etc.: o app continua funcionando sem salvar */ }
  },
  zerar() {
    this.d = this.padrao();
    try { localStorage.removeItem(this.CHAVE); } catch (e) { /* ignora */ }
  }
};

/* ---------- notação e nomes em português ---------- */
const VALOR = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 100 };
const NOME = { p: 'peão', n: 'cavalo', b: 'bispo', r: 'torre', q: 'dama', k: 'rei' };
const FEM = { r: true, q: true };
const oPeca = t => (FEM[t] ? 'a ' : 'o ') + NOME[t];           // "a torre"
const umPeca = t => (FEM[t] ? 'uma ' : 'um ') + NOME[t];        // "uma torre"
const suaPeca = t => (FEM[t] ? 'sua ' : 'seu ') + NOME[t];      // "sua torre"
const LETRA_PT = { K: 'R', Q: 'D', R: 'T', B: 'B', N: 'C' };
/* converte a notação inglesa do chess.js (K,Q,R,B,N) para a brasileira (R,D,T,B,C) */
const sanPt = san => san.replace(/[KQRBN]/g, c => LETRA_PT[c]);
const semSinal = san => san.replace(/[+#]/g, '');
const uciDe = m => m.from + m.to + (m.promotion || '');

/* ---------- funções auxiliares de xadrez ---------- */
const nomeCasa = (x, y) => String.fromCharCode(97 + x) + (y + 1);
const SALTOS = [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]];
const RETAS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const DIAGS = [[1, 1], [1, -1], [-1, 1], [-1, -1]];

/* posição do chess.js -> mapa {casa: 'wK'} usado pelo tabuleiro */
function mapaDoJogo(g) {
  const m = {}; const b = g.board();
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) { const c = b[r][f]; if (c) m[nomeCasa(f, 7 - r)] = c.color + c.type.toUpperCase(); }
  return m;
}
/* casas que a peça em "sq" alcança/ataca (inclui a primeira peça encontrada em cada linha) */
function alcance(g, sq) {
  const p = g.get(sq); if (!p) return [];
  const f = sq.charCodeAt(0) - 97, r = +sq[1] - 1, out = [];
  const visita = (x, y) => { if (x < 0 || x > 7 || y < 0 || y > 7) return false; const s = nomeCasa(x, y); out.push(s); return !g.get(s); };
  const raio = d => { let x = f + d[0], y = r + d[1]; while (visita(x, y)) { x += d[0]; y += d[1]; } };
  if (p.type === 'n') SALTOS.forEach(d => visita(f + d[0], r + d[1]));
  else if (p.type === 'k') { RETAS.concat(DIAGS).forEach(d => visita(f + d[0], r + d[1])); }
  else if (p.type === 'p') { const dir = p.color === 'w' ? 1 : -1; visita(f - 1, r + dir); visita(f + 1, r + dir); }
  else { if (p.type !== 'b') RETAS.forEach(raio); if (p.type !== 'r') DIAGS.forEach(raio); }
  return out;
}
/* casas com peças da cor "cor" que atacam/defendem a casa "sq" */
function atacantes(g, sq, cor) {
  const out = [];
  for (let x = 0; x < 8; x++) for (let y = 0; y < 8; y++) {
    const s = nomeCasa(x, y), p = g.get(s);
    if (p && p.color === cor && s !== sq && alcance(g, s).includes(sq)) out.push(s);
  }
  return out;
}
/* avaliação estática de trocas: quanto o lado da vez ganha capturando em "sq" (>= 0) */
function ganhoNaCasa(g, sq) {
  const caps = g.moves({ verbose: true }).filter(m => m.to === sq && m.captured && m.flags.indexOf('e') < 0);
  if (!caps.length) return 0;
  caps.sort((a, b) => VALOR[a.piece] - VALOR[b.piece]);
  const m = caps[0];
  const v = VALOR[m.captured] + (m.promotion ? VALOR[m.promotion] - 1 : 0);
  g.move(m); const r = Math.max(0, v - ganhoNaCasa(g, sq)); g.undo();
  return r;
}
/* ganho líquido de fazer a captura "m" (objeto de lance do chess.js) */
function ganhoDaCaptura(g, m) {
  if (!m.captured) return 0;
  const v = VALOR[m.captured] + (m.promotion ? VALOR[m.promotion] - 1 : 0);
  if (!g.move(m)) return 0;
  const r = v - ganhoNaCasa(g, m.to); g.undo();
  return r;
}
/* depois de um lance para "sq": a peça ali ataca duas ou mais peças valiosas? (garfo) */
function detectarGarfo(g, sq) {
  const p = g.get(sq); if (!p || p.type === 'k') return null;
  const ini = p.color === 'w' ? 'b' : 'w';
  const alvos = alcance(g, sq).filter(s => { const q = g.get(s); return q && q.color === ini; })
    .filter(s => { const q = g.get(s); return q.type === 'k' || VALOR[q.type] > VALOR[p.type] || (q.type !== 'p' && atacantes(g, s, ini).length === 0); });
  if (alvos.length < 2) return null;
  // a peça que dá o garfo não pode ser capturada com lucro
  if (g.turn() === ini && !g.in_check() && ganhoNaCasa(g, sq) > 0) return null;
  if (g.turn() === ini && g.in_check()) { const caps = g.moves({ verbose: true }).filter(m => m.to === sq); if (caps.length) return null; }
  return { peca: p.type, alvos: alvos.map(s => ({ sq: s, type: g.get(s).type })) };
}
function materialDe(g, cor) {
  let s = 0; const b = g.board();
  for (const linha of b) for (const c of linha) if (c && c.type !== 'k') s += (c.color === cor ? 1 : -1) * VALOR[c.type];
  return s;
}
/* devolve o lance (objeto do chess.js) correspondente a um texto UCI, sem alterar o jogo */
function lanceDeUci(g, uci) {
  if (!uci) return null;
  const m = g.move({ from: uci.slice(0, 2), to: uci.slice(2, 4), promotion: uci[4] || undefined });
  if (m) g.undo();
  return m;
}
/* o lado da vez consegue dar mate em até k lances? (busca completa, usada nos exercícios de mate) */
function existeMate(g, k) {
  const ls = g.moves();
  if (k === 1) return ls.some(s => s.endsWith('#'));
  for (const s of ls) {
    if (s.endsWith('#')) return true;
    g.move(s); const ok = todasLevamAMate(g, k - 1); g.undo();
    if (ok) return true;
  }
  return false;
}
/* para qualquer resposta do lado da vez, o adversário ainda dá mate em até k lances? */
function todasLevamAMate(g, k) {
  const rs = g.moves(); if (!rs.length) return false;
  for (const r of rs) { g.move(r); const ok = existeMate(g, k); g.undo(); if (!ok) return false; }
  return true;
}
/* chance de vitória (0 a 100) a partir da avaliação em centipeões */
const chanceVitoria = cp => 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1);
/* junta cp e mate num número só */
const notaUnica = av => av.mate != null ? (av.mate > 0 ? 10000 - av.mate * 10 : -10000 - av.mate * 10) : (av.cp || 0);

/* ==========================================================================
   MOTORES
   1) Stockfish (WebAssembly ou JS) dentro de um Web Worker criado por Blob
   2) Motor reserva próprio (minimax com poda alfa-beta) — usado enquanto o
      Stockfish carrega ou se ele não puder ser carregado. O jogo nunca trava.
   ========================================================================== */
const CDN_SF = [
  { js: 'https://cdn.jsdelivr.net/npm/stockfish@10.0.2/src/stockfish.js', wasm: 'https://cdn.jsdelivr.net/npm/stockfish@10.0.2/src/stockfish.wasm', ms: 12000 },
  { js: 'https://cdn.jsdelivr.net/npm/stockfish@10.0.2/src/stockfish.asm.js', ms: 25000 },
  { js: 'https://unpkg.com/stockfish@10.0.2/src/stockfish.js', wasm: 'https://unpkg.com/stockfish@10.0.2/src/stockfish.wasm', ms: 12000 },
  { js: 'https://unpkg.com/stockfish@10.0.2/src/stockfish.asm.js', ms: 25000 }
];

/* cria o Worker a partir de um Blob que faz importScripts do CDN (evita o erro de origem cruzada) */
function criarWorkerSF(fonte) {
  const codigo = 'try{importScripts(' + JSON.stringify(fonte.js) + ');}catch(e){postMessage("__falha__ "+e);}';
  const url = URL.createObjectURL(new Blob([codigo], { type: 'application/javascript' }));
  // o stockfish.js lê o endereço do arquivo .wasm a partir do "hash" do endereço do worker
  return new Worker(url + (fonte.wasm ? '#' + fonte.wasm : ''));
}
function testarWorkerSF(fonte) {
  return new Promise(res => {
    let w, fim = false;
    const acabar = ok => { if (fim) return; fim = true; clearTimeout(t); if (!ok && w) { try { w.terminate(); } catch (e) { /* ignora */ } } res(ok ? w : null); };
    const t = setTimeout(() => acabar(false), fonte.ms);
    try {
      w = criarWorkerSF(fonte);
      w.onerror = () => acabar(false);
      w.onmessage = e => {
        const l = typeof e.data === 'string' ? e.data : '';
        if (l.startsWith('__falha__')) acabar(false);
        else if (l === 'uciok') acabar(true);
      };
      w.postMessage('uci');
    } catch (e) { acabar(false); }
  });
}

/* conversa com o Stockfish pelo protocolo UCI, uma análise de cada vez */
class MotorSF {
  constructor(worker) {
    this.w = worker; this.fila = []; this.atual = null;
    worker.onmessage = e => this.receber(e.data);
    worker.onerror = () => { /* tratado pelo limite de tempo em Motor.analisar */ };
  }
  enviar(c) { this.w.postMessage(c); }
  receber(l) {
    if (typeof l !== 'string') return;
    const a = this.atual; if (!a) return;
    if (l.startsWith('info') && l.indexOf(' pv ') > 0 && l.indexOf('bound') < 0) {
      const mp = / multipv (\d+)/.exec(l); if (mp && mp[1] !== '1') return;
      const cp = /score cp (-?\d+)/.exec(l), mt = /score mate (-?\d+)/.exec(l);
      if (cp) { a.cp = +cp[1]; a.mate = null; } else if (mt) { a.mate = +mt[1]; a.cp = null; }
      a.pv = l.split(' pv ')[1].trim().split(/\s+/);
    } else if (l.startsWith('bestmove')) {
      this.atual = null;
      const best = l.split(' ')[1];
      a.res(a.cancelado ? null : { best: best && best !== '(none)' ? best : null, cp: a.cp, mate: a.mate, pv: a.pv || [] });
      this.proximo();
    }
  }
  analisar(fen, op) { return new Promise(res => { this.fila.push({ fen, op, res, cp: 0, mate: null }); this.proximo(); }); }
  proximo() {
    if (this.atual || !this.fila.length) return;
    const t = this.atual = this.fila.shift();
    this.enviar('setoption name Skill Level value ' + (t.op.skill == null ? 20 : t.op.skill));
    this.enviar('position fen ' + t.fen);
    this.enviar('go' + (t.op.depth ? ' depth ' + t.op.depth : '') + (t.op.movetime ? ' movetime ' + t.op.movetime : (t.op.depth ? '' : ' movetime 500')));
  }
  cancelar() {
    this.fila.forEach(t => t.res(null)); this.fila = [];
    if (this.atual) { this.atual.cancelado = true; this.enviar('stop'); }
  }
  matar() { try { this.w.terminate(); } catch (e) { /* ignora */ } if (this.atual) this.atual.res(null); this.fila.forEach(t => t.res(null)); this.fila = []; this.atual = null; }
}

/* ---------- motor reserva: minimax com poda alfa-beta ---------- */
const MATE = 100000;
function avaliarPosicao(g) {
  // material + posição simples, do ponto de vista de quem joga
  let s = 0, total = 0; const b = g.board(); const lista = [];
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) { const c = b[r][f]; if (c) { lista.push([c, f, 7 - r]); if (c.type !== 'k' && c.type !== 'p') total += VALOR[c.type]; } }
  for (const [c, f, y] of lista) {
    const centro = 3.5 - Math.max(Math.abs(f - 3.5), Math.abs(y - 3.5));   // 0 (borda) a 3 (centro)
    let v = 0;
    if (c.type === 'p') { const av = c.color === 'w' ? y - 1 : 6 - y; v = 100 + av * 6 + ((f === 3 || f === 4) ? centro * 8 : 0); }
    else if (c.type === 'n') v = 320 + centro * 12;
    else if (c.type === 'b') v = 330 + centro * 6;
    else if (c.type === 'r') v = 500 + (((c.color === 'w' ? y : 7 - y) === 6) ? 15 : 0);
    else if (c.type === 'q') v = 900 + centro * 3;
    else v = total > 26 ? -centro * 14 : centro * 10;                        // rei: escondido no meio-jogo, ativo no final
    s += c.color === 'w' ? v : -v;
  }
  return g.turn() === 'w' ? s : -s;
}
function buscaSimples(fen, op) {
  const g = new Chess(fen);
  const fim = Date.now() + (op.movetime || 600);
  const maxProf = limita(op.profSimples || 2, 1, 4);
  let estourou = false, melhor = null, nota = 0;
  const peso = m => (m.captured ? 10 * VALOR[m.captured] - VALOR[m.piece] : 0) + (m.promotion ? 8 : 0) + (m.san.indexOf('+') > 0 ? 1 : 0);
  const ordenar = ms => ms.sort((a, b) => peso(b) - peso(a));
  function quieta(a, b, prof) {
    const parada = avaliarPosicao(g);
    if (prof === 0 || parada >= b) return parada;
    if (parada > a) a = parada;
    const ms = ordenar(g.moves({ verbose: true }).filter(m => m.captured || m.promotion));
    for (const m of ms) { g.move(m); const v = -quieta(-b, -a, prof - 1); g.undo(); if (v >= b) return b; if (v > a) a = v; }
    return a;
  }
  function nega(prof, a, b, ply) {
    if (Date.now() > fim) { estourou = true; return 0; }
    const ms = g.moves({ verbose: true });
    if (!ms.length) return g.in_check() ? -MATE + ply : 0;
    if (g.insufficient_material()) return 0;
    if (prof === 0) return quieta(a, b, 2);
    ordenar(ms);
    for (const m of ms) {
      g.move(m); const v = -nega(prof - 1, -b, -a, ply + 1); g.undo();
      if (estourou) return 0;
      if (v >= b) return b;
      if (v > a) a = v;
    }
    return a;
  }
  for (let d = 1; d <= maxProf; d++) {
    const ms = ordenar(g.moves({ verbose: true })); if (!ms.length) break;
    if (melhor) { const i = ms.findIndex(m => m.san === melhor.san); if (i > 0) ms.unshift(ms.splice(i, 1)[0]); }
    let a = -MATE * 2, bm = null;
    for (const m of ms) {
      g.move(m); const v = -nega(d - 1, -MATE * 2, -a, 1); g.undo();
      if (estourou) break;
      if (v > a) { a = v; bm = m; }
    }
    if (estourou && melhor) break;
    if (bm) { melhor = bm; nota = a; }
    if (estourou || Math.abs(nota) > MATE - 1000) break;
  }
  if (!melhor) return { best: null, cp: 0, mate: null, pv: [] };
  let cp = Math.round(nota), mate = null;
  if (Math.abs(nota) > MATE - 1000) { mate = Math.ceil((MATE - Math.abs(nota)) / 2) * (nota > 0 ? 1 : -1); cp = null; }
  return { best: uciDe(melhor), cp, mate, pv: [uciDe(melhor)] };
}

/* ---------- fachada única usada pelo resto do app ---------- */
const Motor = {
  sf: null,
  estado: 'carregando',          // 'carregando' | 'stockfish' | 'basico'
  geracao: 0,
  aoMudar: null,
  async iniciar() {
    if (typeof Worker === 'undefined') { this.estado = 'basico'; if (this.aoMudar) this.aoMudar(); return; }
    for (const fonte of CDN_SF) {
      const w = await testarWorkerSF(fonte);
      if (w) { this.sf = new MotorSF(w); this.estado = 'stockfish'; if (this.aoMudar) this.aoMudar(); return; }
    }
    this.estado = 'basico'; if (this.aoMudar) this.aoMudar();
  },
  rotulo() {
    return this.estado === 'stockfish' ? '<i class="ponto ok"></i>Motor: Stockfish'
      : this.estado === 'carregando' ? '<i class="ponto"></i>Carregando o Stockfish… (motor básico em uso)'
        : '<i class="ponto"></i>Motor básico (Stockfish indisponível)';
  },
  /* analisa uma posição. Resultado do ponto de vista de quem joga: {best, cp, mate, pv} ou null se cancelado */
  analisar(fen, op = {}) {
    if (this.sf) {
      const sf = this.sf;
      const limite = (op.movetime || 3000) + 15000;
      return new Promise(res => {
        let feito = false;
        const t = setTimeout(() => {           // Stockfish parou de responder: troca para o motor reserva
          if (feito) return; feito = true;
          if (this.sf === sf) { sf.matar(); this.sf = null; this.estado = 'basico'; if (this.aoMudar) this.aoMudar(); }
          this.simples(fen, op).then(res);
        }, limite);
        sf.analisar(fen, op).then(r => { if (feito) return; feito = true; clearTimeout(t); res(r); });
      });
    }
    return this.simples(fen, op);
  },
  simples(fen, op) {
    const ger = this.geracao;
    return new Promise(res => setTimeout(() => {
      if (ger !== this.geracao) return res(null);
      let r = null;
      try { r = buscaSimples(fen, { movetime: Math.min(op.movetime || 700, 1200), profSimples: op.profSimples || 2 }); } catch (e) { r = null; }
      res(r);
    }, 30));
  },
  cancelar() { this.geracao++; if (this.sf) this.sf.cancelar(); }
};

/* carrega um script externo (usado para o chess.js via CDN, com endereços alternativos) */
const CDN_CHESS = [
  'https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js',
  'https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js',
  'https://unpkg.com/chess.js@0.10.3/chess.js'
];
function carregarScript(url) {
  return new Promise((ok, falha) => {
    const s = document.createElement('script'); s.src = url; s.async = true;
    s.onload = () => ok(); s.onerror = () => { s.remove(); falha(new Error('falha ao carregar ' + url)); };
    document.head.appendChild(s);
  });
}
async function carregarChess() {
  for (const url of CDN_CHESS) {
    try { await carregarScript(url); if (typeof Chess === 'function') return true; } catch (e) { /* tenta o próximo endereço */ }
  }
  return typeof Chess === 'function';
}

/* ==========================================================================
   TABULEIRO — desenhado com CSS Grid; peças em SVG; toque, clique e arrastar
   opcoes:
     alvos(casa)            -> lista de casas de destino se a peça pode ser pega, ou null
     promocao(de, para)     -> true se o lance é uma promoção (abre o seletor)
     mover(de, para, promo) -> chamado quando o jogador faz um lance
   ========================================================================== */
class Tabuleiro {
  constructor(hospedeiro, opcoes = {}) {
    this.op = opcoes; this.ori = 'w'; this.pos = {}; this.els = {}; this.casas = {};
    this.sel = null; this.alvosSel = []; this.ativo = true; this.arrasto = null;
    this.marcas = { ult: [], xq: null, estrelas: [], blocos: [] }; this.listaSetas = [];
    this.el = document.createElement('div');
    this.el.className = 'tabuleiro' + (opcoes.estatico ? ' estatico' : '');
    this.el.innerHTML = '<div class="casas"></div><div class="pecas"></div><svg class="setas" viewBox="0 0 8 8"></svg>';
    this.elCasas = this.el.children[0]; this.elPecas = this.el.children[1]; this.elSetas = this.el.children[2];
    hospedeiro.appendChild(this.el);
    this.montarCasas();
    if (!opcoes.estatico) {
      this.el.addEventListener('pointerdown', e => this.aoBaixar(e));
      this.el.addEventListener('pointermove', e => this.aoMoverPonteiro(e));
      this.el.addEventListener('pointerup', e => this.aoSoltar(e));
      this.el.addEventListener('pointercancel', e => this.aoSoltar(e, true));
      this.el.addEventListener('contextmenu', e => e.preventDefault());
    }
  }
  /* coluna/linha na tela (0..7) de uma casa, conforme a orientação */
  xy(casa) { const f = casa.charCodeAt(0) - 97, r = +casa[1] - 1; return this.ori === 'w' ? [f, 7 - r] : [7 - f, r]; }
  casaEm(cx, cy) {
    const r = this.el.getBoundingClientRect();
    const x = Math.floor((cx - r.left) / r.width * 8), y = Math.floor((cy - r.top) / r.height * 8);
    if (x < 0 || x > 7 || y < 0 || y > 7) return null;
    return this.ori === 'w' ? nomeCasa(x, 7 - y) : nomeCasa(7 - x, y);
  }
  montarCasas() {
    let h = '';
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
      const casa = this.ori === 'w' ? nomeCasa(x, 7 - y) : nomeCasa(7 - x, y);
      const escura = (casa.charCodeAt(0) - 97 + (+casa[1] - 1)) % 2 === 0;
      h += `<div class="casa${escura ? ' e' : ''}" data-c="${casa}">${x === 0 ? `<span class="co n">${casa[1]}</span>` : ''}${y === 7 ? `<span class="co l">${casa[0]}</span>` : ''}</div>`;
    }
    this.elCasas.innerHTML = h;
    this.casas = {}; $$('.casa', this.elCasas).forEach(c => { this.casas[c.dataset.c] = c; });
  }
  orientar(cor) {
    if (cor === this.ori) return;
    this.ori = cor; this.montarCasas();
    this.elPecas.classList.add('sem-anim');
    for (const c in this.els) this.colocar(this.els[c], c);
    void this.elPecas.offsetWidth; this.elPecas.classList.remove('sem-anim');
    this.pintarMarcas(); this.desenharSetas(); this.pintarSelecao();
  }
  colocar(el, casa) { const [x, y] = this.xy(casa); el.style.transform = `translate(${x * 100}%,${y * 100}%)`; }
  criarPeca(cod) {
    const el = document.createElement('div');
    el.className = 'pc ' + cod[0];
    el.innerHTML = `<svg viewBox="0 0 100 100"><use href="#pc-${cod[1].toLowerCase()}"/></svg>`;
    return el;
  }
  /* atualiza as peças para o novo mapa {casa:'wK'}, reaproveitando elementos para animar os lances */
  posicionar(mapa, animar = true) {
    if (!animar) this.elPecas.classList.add('sem-anim');
    const livres = [], novos = {};
    for (const c in this.pos) { if (mapa[c] === this.pos[c]) novos[c] = this.els[c]; else livres.push({ c, cod: this.pos[c], el: this.els[c] }); }
    for (const c in mapa) {
      if (novos[c]) continue;
      const [x, y] = this.xy(c);
      let melhor = -1, dist = 99;
      livres.forEach((l, i) => { if (l.cod !== mapa[c]) return; const [a, b] = this.xy(l.c); const d = Math.abs(a - x) + Math.abs(b - y); if (d < dist) { dist = d; melhor = i; } });
      let el;
      if (melhor >= 0) { el = livres.splice(melhor, 1)[0].el; this.elPecas.appendChild(el); this.colocar(el, c); }
      else {
        el = this.criarPeca(mapa[c]); el.classList.add('nova'); this.colocar(el, c); this.elPecas.appendChild(el);
        requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('nova')));
      }
      novos[c] = el;
    }
    livres.forEach(l => l.el.remove());
    this.pos = Object.assign({}, mapa); this.els = novos;
    for (const c in this.els) this.els[c].classList.remove('arr');
    if (!animar) { void this.elPecas.offsetWidth; this.elPecas.classList.remove('sem-anim'); }
  }
  redesenhar() { for (const c in this.els) { this.els[c].classList.remove('arr'); this.colocar(this.els[c], c); } }
  /* destaques: último lance, rei em xeque, estrelas e casas bloqueadas */
  marcar(m) { Object.assign(this.marcas, m); this.pintarMarcas(); }
  pintarMarcas() {
    for (const c in this.casas) this.casas[c].classList.remove('ult', 'xq', 'estrela', 'bloco');
    (this.marcas.ult || []).forEach(c => this.casas[c] && this.casas[c].classList.add('ult'));
    if (this.marcas.xq && this.casas[this.marcas.xq]) this.casas[this.marcas.xq].classList.add('xq');
    (this.marcas.estrelas || []).forEach(c => this.casas[c] && this.casas[c].classList.add('estrela'));
    (this.marcas.blocos || []).forEach(c => this.casas[c] && this.casas[c].classList.add('bloco'));
  }
  piscarErro(casa) { const c = this.casas[casa]; if (!c) return; c.classList.add('mal'); setTimeout(() => c.classList.remove('mal'), 650); this.el.classList.add('treme'); setTimeout(() => this.el.classList.remove('treme'), 320); }
  /* setas: [{de, para, cor}] */
  setas(lista) { this.listaSetas = lista || []; this.desenharSetas(); }
  desenharSetas() {
    const CORES = { verde: '#35c27a', vermelho: '#ef5a5a', azul: '#4f9df7', amarelo: '#f0b441' };
    let h = '';
    for (const s of this.listaSetas) {
      const [x1, y1] = this.xy(s.de).map(v => v + .5), [x2, y2] = this.xy(s.para).map(v => v + .5);
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy); if (!len) continue;
      const ux = dx / len, uy = dy / len, cab = .42;
      const bx = x2 - ux * cab, by = y2 - uy * cab;       // base da ponta
      const px = -uy, py = ux, cor = CORES[s.cor] || s.cor;
      h += `<g opacity=".88"><line x1="${x1 + ux * .22}" y1="${y1 + uy * .22}" x2="${bx}" y2="${by}" stroke="${cor}" stroke-width=".17" stroke-linecap="round"/>` +
        `<polygon points="${x2 - ux * .06},${y2 - uy * .06} ${bx + px * .24},${by + py * .24} ${bx - px * .24},${by - py * .24}" fill="${cor}"/></g>`;
    }
    this.elSetas.innerHTML = h;
  }
  /* ---------- seleção ---------- */
  selecionar(casa, alvos) { this.sel = casa; this.alvosSel = alvos || []; this.pintarSelecao(); }
  limparSelecao() { this.sel = null; this.alvosSel = []; this.pintarSelecao(); }
  pintarSelecao() {
    for (const c in this.casas) this.casas[c].classList.remove('sel', 'pt', 'cap');
    if (!this.sel) return;
    if (this.casas[this.sel]) this.casas[this.sel].classList.add('sel');
    this.alvosSel.forEach(c => { if (this.casas[c]) this.casas[c].classList.add(this.pos[c] ? 'cap' : 'pt'); });
  }
  /* ---------- toque / mouse ---------- */
  aoBaixar(e) {
    if (!this.ativo || this.elPromo || (e.button && e.button > 0)) return;
    const casa = this.casaEm(e.clientX, e.clientY); if (!casa) return;
    e.preventDefault();
    if (this.sel && this.alvosSel.includes(casa)) { const de = this.sel; this.limparSelecao(); this.tentar(de, casa); return; }
    const alvos = this.op.alvos ? this.op.alvos(casa) : null;
    if (alvos && this.els[casa]) {
      const jaSel = this.sel === casa;
      this.selecionar(casa, alvos);
      this.arrasto = { casa, id: e.pointerId, x0: e.clientX, y0: e.clientY, ativo: false, el: this.els[casa], jaSel };
      try { this.el.setPointerCapture(e.pointerId); } catch (err) { /* navegador antigo */ }
    } else this.limparSelecao();
  }
  aoMoverPonteiro(e) {
    const d = this.arrasto; if (!d || e.pointerId !== d.id) return;
    if (!d.ativo) { if (Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 8) return; d.ativo = true; d.el.classList.add('arr'); this.elPecas.appendChild(d.el); }
    const r = this.el.getBoundingClientRect(), t = r.width / 8;
    const x = limita(e.clientX - r.left, 0, r.width) - t / 2, y = limita(e.clientY - r.top, 0, r.height) - t / 2;
    d.el.style.transform = `translate(${x}px,${y}px) scale(1.12)`;
  }
  aoSoltar(e, cancelado) {
    const d = this.arrasto; if (!d || e.pointerId !== d.id) return;
    this.arrasto = null;
    try { this.el.releasePointerCapture(e.pointerId); } catch (err) { /* ignora */ }
    if (d.ativo) {
      d.el.classList.remove('arr');
      const casa = cancelado ? null : this.casaEm(e.clientX, e.clientY);
      if (casa && this.alvosSel.includes(casa)) { this.limparSelecao(); this.tentar(d.casa, casa); }
      else this.colocar(d.el, d.casa);
    } else if (d.jaSel) this.limparSelecao();
  }
  tentar(de, para) {
    const cor = this.pos[de] ? this.pos[de][0] : 'w';
    if (this.op.promocao && this.op.promocao(de, para)) {
      this.pedirPromocao(cor).then(p => { if (p) this.op.mover(de, para, p); else this.redesenhar(); });
    } else if (this.op.mover) this.op.mover(de, para);
  }
  pedirPromocao(cor) {
    return new Promise(res => {
      const d = document.createElement('div'); d.className = 'promo'; this.elPromo = d;
      d.innerHTML = '<div class="cx">' + ['q', 'r', 'b', 'n'].map(t => `<button data-t="${t}" aria-label="${NOME[t]}" title="${NOME[t]}">${pecaSvg(t, cor)}</button>`).join('') + '</div>';
      d.addEventListener('pointerdown', ev => ev.stopPropagation());
      d.addEventListener('click', ev => {
        const b = ev.target.closest('button'); d.remove(); this.elPromo = null; res(b ? b.dataset.t : null);
      });
      this.el.appendChild(d);
    });
  }
}

      {t:'quiz', fen:'7k/8/8/8/8/2b5/3n4/4K3 w - - 0 1', q:'Agora o cavalo de d2 está defendido pelo bispo. O rei branco pode capturá-lo?',
        opts:['Sim, o rei captura qualquer peça vizinha','Não: o rei ficaria em xeque do bispo','Sim, mas depois perde o rei'], a:1,
        ok:'Exato. O rei nunca pode entrar numa casa atacada.', err:'O rei nunca pode ir para uma casa atacada por uma peça adversária.'}
    ]}
]},

{ id:'m2', nome:'Regras especiais', desc:'Roque, en passant, promoção, xeque, mate e empate', fases:[
  { id:'roque', nome:'Roque', icone:'k',
    intro:'O <b>roque</b> é um lance especial: o rei anda <b>duas casas</b> em direção a uma torre e a torre pula para o outro lado dele. Serve para proteger o rei e ativar a torre. Só vale se: rei e torre ainda não se moveram, não há peças entre eles, o rei não está em xeque e não passa por casa atacada. <b>Para rocar, mova o rei duas casas.</b>',
    ex:[
      {t:'seq', fen:'r3k2r/pppppppp/8/8/8/8/PPPPPPPP/R3K2R w KQkq - 0 1', p:'Faça o roque pequeno: mova o rei duas casas para a direita (de e1 para g1).', line:['O-O'],
        ok:'Roque pequeno feito! O rei ficou protegido atrás dos peões.', err:'Toque no rei e depois na casa g1.'},
      {t:'seq', fen:'r3k2r/pppppppp/8/8/8/8/PPPPPPPP/R3K2R w KQkq - 0 1', p:'Agora o roque grande: mova o rei duas casas para a esquerda (de e1 para c1).', line:['O-O-O'],
        ok:'Roque grande! A torre já saiu ativa em d1.', err:'Toque no rei e depois na casa c1.'},
      {t:'seq', fen:'5rk1/8/8/8/8/8/8/R3K2R w KQ - 0 1', p:'A torre preta ataca a casa f1, por onde o rei passaria. Faça o roque para o lado que ainda é permitido.', line:['O-O-O'],
        ok:'Isso! O rei não pode passar por casa atacada, então só o roque grande era possível.', err:'O roque pequeno é proibido aqui (o rei passaria por f1, que está atacada). Faça o roque grande.'},
      {t:'quiz', q:'Você pode fazer roque se o seu rei já tiver se movido antes na partida?', opts:['Sim, se ele voltou para a casa inicial','Não, nunca mais','Sim, mas só o roque grande'], a:1,
        ok:'Certo. Rei que se moveu perde o direito ao roque para sempre.', err:'Depois que o rei se move, o roque não é mais permitido, mesmo que ele volte.'}
    ]},
  { id:'enpassant', nome:'En passant', icone:'p',
    intro:'<b>En passant</b> (“de passagem”) é uma captura especial de peão. Quando um peão adversário anda duas casas e para bem ao lado do seu peão, você pode capturá-lo como se ele tivesse andado só uma casa. Mas atenção: só vale <b>no lance imediatamente seguinte</b>.',
    ex:[
      {t:'seq', fen:'4k3/8/8/3pP3/8/8/8/4K3 w - d6 0 1', p:'O peão preto acabou de andar duas casas e parou ao lado do seu. Capture en passant!', line:['exd6'],
        ok:'Isso! Seu peão foi para d6 e o peão preto saiu do tabuleiro.', err:'Mova seu peão de e5 para d6 (a casa por onde o peão preto “passou”).'},
      {t:'seq', fen:'4k3/2p5/8/3P4/8/8/8/4K3 b - - 0 1', pre:'c5', p:'Observe o lance das pretas... e capture en passant.', line:['dxc6'],
        ok:'Perfeito, você pegou o peão “de passagem”.', err:'O peão preto andou duas casas e parou ao lado do seu. Capture indo para c6.'},
      {t:'seq', fen:'4k3/8/8/pP6/8/8/8/4K3 w - a6 0 1', p:'Mais uma vez, agora pelo outro lado. Capture en passant.', line:['bxa6'],
        ok:'Muito bem!', err:'Leve o peão de b5 para a6.'},
      {t:'quiz', q:'Você pode guardar o en passant para fazer alguns lances depois?', opts:['Sim, quando quiser','Não: só no lance imediatamente seguinte','Sim, até o peão se mover de novo'], a:1,
        ok:'Isso. É agora ou nunca.', err:'O en passant só vale logo depois do avanço duplo do peão adversário.'}
    ]},
  { id:'promocao', nome:'Promoção', icone:'q',
    intro:'Quando um peão chega à <b>última fileira</b>, ele é promovido: troca-se por dama, torre, bispo ou cavalo (você escolhe). Quase sempre a dama é a melhor escolha — mas nem sempre!',
    ex:[
      {t:'seq', fen:'8/4P1k1/8/8/8/8/8/4K3 w - - 0 1', p:'Leve o peão até a última casa e escolha a dama.', line:['e8=Q'],
        ok:'Uma nova dama no tabuleiro!', err:'Avance o peão para e8 e escolha a dama.'},
      {t:'seq', fen:'3r2k1/4P3/8/8/8/8/8/4K3 w - - 0 1', p:'Capture a torre e promova a dama ao mesmo tempo.', line:['exd8=Q+'],
        ok:'Dois em um: ganhou a torre e ainda fez uma dama.', err:'O peão captura na diagonal: tome a torre em d8 e escolha a dama.'},
      {t:'quiz', q:'Em quais peças um peão pode ser promovido?', opts:['Somente em dama','Dama, torre, bispo ou cavalo','Em qualquer peça, até em rei'], a:1,
        ok:'Certo! E você pode ter mais de uma dama.', err:'Pode ser dama, torre, bispo ou cavalo — nunca rei, e não pode continuar peão.'},
      {t:'seq', fen:'8/3q1P1k/8/8/8/8/5PPP/6K1 w - - 0 1', p:'As pretas ameaçam mate com a dama em d1. Promova a uma peça que dê xeque e ataque a dama ao mesmo tempo!', line:['f8=N+','Kg7','Nxd7'],
        ok:'Genial! Promover a cavalo deu um garfo no rei e na dama.', err:'Uma dama em f8 não dá xeque, e as pretas dariam mate. Que peça em f8 atacaria o rei em h7 e a dama em d7?',
        wrong:{'f8=Q':'A dama nova não dá xeque e as pretas jogam Dd1 mate! Tente promover a outra peça.'}}
    ]},
  { id:'xeque', nome:'Xeque', icone:'k',
    intro:'<b>Xeque</b> é quando o rei está atacado. Quem está em xeque é obrigado a sair dele, e existem três jeitos: <b>mover o rei</b>, <b>bloquear</b> o ataque com outra peça ou <b>capturar</b> a peça que dá xeque.',
    ex:[
      {t:'seq', fen:'4k3/8/8/8/8/8/3q4/3RK3 w - - 0 1', p:'Seu rei está em xeque. Capture a peça que dá o xeque.', line:[['Rxd2','Kxd2']],
        ok:'Isso! Capturar o atacante é o melhor jeito quando é possível.', err:'A dama preta em d2 está dando xeque e está sem defesa. Capture-a.'},
      {t:'seq', fen:'6k1/8/8/8/8/5R2/6PP/r6K w - - 0 1', p:'Xeque da torre! O rei não tem para onde ir. Bloqueie o xeque.', line:['Rf1'],
        ok:'Boa! Sua torre entrou na frente e protegeu o rei.', err:'Coloque sua torre entre a torre preta e o seu rei (em f1).'},
      {t:'seq', fen:'4k3/8/8/1b6/8/8/8/5K2 w - - 0 1', any:true, p:'Xeque do bispo! Mova o rei para uma casa segura.', line:['Kg1'],
        ok:'Pronto, fora da diagonal do bispo.', err:'O rei precisa sair da diagonal do bispo.'},
      {t:'seq', fen:'4k3/8/8/8/8/8/8/3QK3 w - - 0 1', p:'Agora é sua vez: dê um xeque seguro no rei preto com a dama.', line:[['Qa4+','Qh5+','Qe2+']],
        ok:'Xeque! E a dama ficou longe do rei adversário, em segurança.', err:'Procure uma casa de onde a dama ataque o rei sem poder ser capturada.',
        wrong:{'Qd7':'É xeque, mas o rei captura sua dama! Dê xeque de longe.','Qd8':'É xeque, mas o rei captura sua dama! Dê xeque de longe.'}}
    ]},
  { id:'mate', nome:'Xeque-mate', icone:'k',
    intro:'<b>Xeque-mate</b> é o objetivo do jogo: o rei está em xeque e não existe nenhum jeito de escapar — não dá para mover, bloquear nem capturar. Quem dá mate vence a partida.',
    ex:[
      {t:'mate', n:1, fen:'6k1/5ppp/8/8/8/8/8/R3K3 w - - 0 1', p:'Dê xeque-mate em 1 lance.', sol:['Ra8#'],
        ok:'Mate! O rei ficou preso atrás dos próprios peões.', err:'Ainda não é mate. Ataque o rei pela última fileira.'},
      {t:'mate', n:1, fen:'7k/8/5K2/8/8/8/8/6Q1 w - - 0 1', p:'Dê xeque-mate em 1 lance com a dama, apoiada pelo rei.', sol:['Qg7#'],
        ok:'Mate! A dama colada no rei, protegida pelo seu rei.', err:'A dama precisa dar xeque numa casa protegida pelo seu rei.'},
      {t:'mate', n:1, fen:'r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4', p:'Dama e bispo miram a mesma casa. Dê mate em 1.', sol:['Qxf7#'],
        ok:'Mate! O bispo protege a dama, então o rei não pode capturá-la.', err:'Qual casa ao lado do rei preto é atacada pela dama e pelo bispo ao mesmo tempo?'},
      {t:'mate', n:1, fen:'7k/R7/8/8/8/8/1R6/4K3 w - - 0 1', p:'Duas torres: uma prende, a outra dá mate. Mate em 1.', sol:['Rb8#'],
        ok:'Mate da escada! Uma torre fecha a 7ª fileira e a outra ataca na 8ª.', err:'A torre de a7 já impede o rei de sair da última fileira. Use a outra torre.'},
      {t:'quiz', q:'Qual é a diferença entre xeque e xeque-mate?', opts:['Nenhuma, são a mesma coisa','No xeque o rei consegue escapar; no mate não há saída','No mate o rei é capturado'], a:1,
        ok:'Exato. E o rei nunca é capturado de verdade: a partida termina no mate.', err:'Xeque é só um ataque ao rei. Mate é um xeque sem nenhuma defesa.'}
    ]},
  { id:'empate', nome:'Empate e afogamento', icone:'k',
    intro:'Nem toda partida tem vencedor. O empate mais traiçoeiro é o <b>afogamento</b>: o jogador da vez <b>não está em xeque</b>, mas <b>não tem nenhum lance legal</b>. Também é empate: repetir a mesma posição três vezes, 50 lances sem captura nem lance de peão, material insuficiente (por exemplo, rei contra rei) ou acordo entre os jogadores.',
    ex:[
      {t:'quiz', fen:'7k/5Q2/6K1/8/8/8/8/8 b - - 0 1', q:'É a vez das pretas. O rei preto não está em xeque, mas todas as casas vizinhas estão atacadas. Qual é o resultado?',
        opts:['Vitória das brancas','Empate por afogamento','As pretas passam a vez'], a:1,
        ok:'Isso. As brancas tinham dama a mais e deixaram escapar a vitória!', err:'Sem xeque e sem lances legais = afogamento = empate.'},
      {t:'mate', n:1, fen:'7k/8/6K1/8/8/8/8/5Q2 w - - 0 1', p:'Cuidado para não afogar o rei! Dê xeque-mate em 1 lance.', sol:['Qf8#'],
        ok:'Mate! Você atacou o rei em vez de só tirar as casas dele.', err:'Não é mate. Lembre: se o rei preto ficar sem lances e sem xeque, é empate.'},
      {t:'quiz', q:'Qual destas situações NÃO é empate?', opts:['Afogamento','Rei contra rei','A mesma posição repetida três vezes','Perder a dama'], a:3,
        ok:'Certo. Perder a dama é ruim, mas a partida continua.', err:'Afogamento, rei contra rei e repetição tripla são empates.'},
      {t:'seq', fen:'7k/2Q3p1/8/8/8/7p/5q2/7K w - - 0 1', p:'As pretas ameaçam mate em g2 e seu rei não tem lances. Use o afogamento a seu favor: entregue a dama com xeque!', line:['Qxg7+','Kxg7'], stalemate:true,
        ok:'Empate por afogamento! Sem a dama, você não tem nenhum lance legal — e salvou meio ponto.', err:'Seu rei já não tem lances. Se a sua dama sumir do tabuleiro, é afogamento. Onde ela pode se sacrificar com xeque?'}
    ]}
]},

{ id:'m3', nome:'Valor das peças e trocas', desc:'Quanto vale cada peça e quando trocar', fases:[
  { id:'valor', nome:'Valor das peças', icone:'q',
    intro:'Cada peça tem um valor aproximado em “pontos de peão”: <b>Peão 1 · Cavalo 3 · Bispo 3 · Torre 5 · Dama 9</b>. O rei não tem preço. Use esses números para decidir se uma troca vale a pena: ganhar mais pontos do que perde é bom negócio.',
    ex:[
      {t:'quiz', q:'Quantos pontos vale a dama?', opts:['5','7','9','12'], a:2, ok:'Isso: 9 pontos, quase duas torres.', err:'A dama vale 9 pontos.'},
      {t:'quiz', q:'O que vale mais: uma torre ou um bispo?', opts:['O bispo','A torre','Valem o mesmo'], a:1, ok:'Certo: torre 5, bispo 3.', err:'A torre vale 5 e o bispo vale 3.'},
      {t:'quiz', q:'Trocar o seu bispo por uma torre do adversário é um bom negócio?', opts:['Sim: dou 3 pontos e ganho 5','Não, o bispo vale mais','Tanto faz'], a:0,
        ok:'Isso! Essa vantagem se chama “ganhar a qualidade”.', err:'Bispo = 3, torre = 5. Você sai ganhando 2 pontos.'},
      {t:'seq', fen:'4k3/8/8/1q3r2/3N4/8/8/4K3 w - - 0 1', p:'Seu cavalo ataca a dama e a torre. Capture a peça que vale mais.', line:['Nxb5'],
        ok:'Claro: a dama (9) vale bem mais que a torre (5).', err:'A dama vale 9 e a torre vale 5. Capture a dama em b5.'},
      {t:'quiz', q:'Você tem 1 torre e 2 peões. O adversário tem 1 bispo e 1 cavalo. Quem tem mais pontos?', opts:['Você: 7 contra 6','O adversário: 6 contra 5','Está igual'], a:0,
        ok:'Isso: 5+1+1 = 7 contra 3+3 = 6.', err:'Torre 5 + dois peões 2 = 7. Bispo 3 + cavalo 3 = 6.'}
    ]},
  { id:'trocas', nome:'Trocas boas e ruins', icone:'r',
    intro:'Antes de capturar, pergunte: <b>“a peça está defendida?”</b> Se não estiver, capture de graça. Se estiver, compare os valores: só capture se o que você ganha vale mais (ou igual) do que o que vai perder. E quando várias peças podem capturar, comece pela de <b>menor valor</b>.',
    ex:[
      {t:'seq', fen:'r3k3/8/8/3n4/8/8/3R4/4K3 w - - 0 1', p:'Há uma peça preta sem defesa. Capture-a.', line:['Rxd5'],
        ok:'Peça de graça! Sempre procure peças sem defesa.', err:'O cavalo em d5 não está defendido por ninguém.'},
      {t:'quiz', fen:'4k3/8/4p3/3p4/8/8/3Q4/4K3 w - - 0 1', q:'A dama branca deve capturar o peão em d5?',
        opts:['Sim, peão de graça','Não: o peão de e6 recaptura e eu perco a dama por um peão','Sim, porque dá xeque'], a:1,
        ok:'Exato. O peão está defendido: trocar 9 pontos por 1 é péssimo.', err:'Olhe o peão em e6: ele defende d5 e capturaria a sua dama.'},
      {t:'seq', fen:'4k3/2p5/3r4/8/8/B7/8/4K3 w - - 0 1', p:'A torre está defendida por um peão. Mesmo assim, vale a pena capturá-la com o bispo?', line:['Bxd6','cxd6'],
        ok:'Vale! Você deu um bispo (3) e levou uma torre (5): ganhou a qualidade.', err:'Bispo (3) por torre (5) é lucro, mesmo sendo recapturado. Capture em d6.'},
      {t:'seq', fen:'4k3/8/3p4/4n3/3P4/5N2/8/3QK3 w - - 0 1', p:'O cavalo preto está defendido. Capture-o com a sua peça de MENOR valor.', line:['dxe5'],
        ok:'Isso! Peão por cavalo: se recapturarem, você perdeu só 1 ponto e ganhou 3.', err:'Tanto o peão quanto o cavalo podem capturar. Use o peão, que vale menos.',
        wrong:{'Nxe5':'Funciona, mas você troca cavalo por cavalo. Com o peão você ganha uma peça!'}}
    ]},
  { id:'contar', nome:'Atacantes e defensores', icone:'n',
    intro:'Para saber se dá para ganhar uma peça defendida, <b>conte</b>: quantas peças suas atacam a casa e quantas do adversário a defendem. Se você tem <b>mais atacantes do que defensores</b>, normalmente ganha material. Se o número é igual, quem captura primeiro costuma sair perdendo.',
    ex:[
      {t:'quiz', fen:'4k3/pp6/5n2/3p4/8/2N5/PP4B1/4K3 w - - 0 1', q:'O peão de d5 é atacado pelo cavalo e pelo bispo (2 atacantes) e defendido só pelo cavalo preto (1 defensor). Dá para ganhar o peão?',
        opts:['Sim: tenho mais atacantes que defensores','Não, está igual','Não, peão defendido nunca se captura'], a:0,
        ok:'Isso mesmo: 2 contra 1.', err:'Conte: 2 atacantes contra 1 defensor. A última captura será sua.'},
      {t:'seq', fen:'4k3/pp6/5n2/3p4/8/2N5/PP4B1/4K3 w - - 0 1', p:'Então faça as contas no tabuleiro: capture o peão e recapture depois.', line:[['Nxd5','Bxd5'],'Nxd5',['Bxd5','Nxd5']],
        ok:'Pronto: trocaram-se os cavalos e você ficou com um peão a mais.', err:'Capture em d5 com o cavalo ou o bispo.'},
      {t:'quiz', fen:'4k3/8/2np4/4p3/8/5N2/8/4RK2 w - - 0 1', q:'O peão de e5 é atacado por cavalo e torre (2) e defendido por cavalo e peão (2). Vale a pena capturar?',
        opts:['Sim, 2 atacantes bastam','Não: com números iguais, a última captura é do defensor','Sim, porque a torre é forte'], a:1,
        ok:'Certo. Você perderia cavalo e torre por dois peões.', err:'2 contra 2: o defensor dá a última captura e você sai perdendo.'},
      {t:'seq', fen:'r3k2r/ppp2ppp/2n5/3q4/8/2N5/PPP2PPP/R2QK2R w KQkq - 0 1', p:'Uma peça preta muito valiosa está atacada e sem nenhuma defesa. Encontre e capture.', line:[['Nxd5','Qxd5']],
        ok:'A dama estava pendurada! Sempre confira o que está sem defesa.', err:'Olhe para a dama preta em d5: quem a defende?'}
    ]}
]},

{ id:'m4', nome:'Táticas', desc:'Os golpes que ganham material', fases:[
  { id:'garfo', nome:'Garfo', icone:'n',
    intro:'<b>Garfo</b> é quando uma peça ataca <b>duas (ou mais) peças ao mesmo tempo</b>. O adversário só consegue salvar uma. O cavalo é o rei dos garfos, mas peões, dama e até o rei também fazem.',
    ex:[
      {t:'seq', fen:'r3k3/8/8/3N4/8/8/8/4K3 w - - 0 1', p:'Dê um garfo de cavalo no rei e na torre.', line:['Nc7+','Kd7','Nxa8'],
        ok:'Garfo! O rei teve que sair do xeque e a torre caiu.', err:'Procure uma casa de onde o cavalo ataque o rei (e8) e a torre (a8) ao mesmo tempo.'},
      {t:'seq', fen:'4k3/8/8/2n1n3/8/3P4/8/7K w - - 0 1', p:'Até o peão dá garfo! Ataque os dois cavalos de uma vez.', line:['d4','Ne6','dxe5'],
        ok:'Um peãozinho ganhou um cavalo inteiro.', err:'Avance o peão para a casa de onde ele ataca os dois cavalos na diagonal.'},
      {t:'seq', fen:'r5k1/8/8/8/8/8/8/3QK3 w - - 0 1', p:'Dê um xeque com a dama que também ataque a torre.', line:['Qd5+','Kg7','Qxa8'],
        ok:'Garfo de dama! Xeque na diagonal e a torre no fim da outra diagonal.', err:'Qual casa central coloca a dama nas diagonais do rei (g8) e da torre (a8)?'},
      {t:'seq', fen:'6k1/3q4/8/8/4N3/8/8/4K3 w - - 0 1', p:'O garfo mais desejado: cavalo atacando rei e dama. Encontre-o!', line:['Nf6+','Kg7','Nxd7'],
        ok:'Garfo real! Rei em xeque e a dama perdida.', err:'De qual casa o cavalo dá xeque em g8 e ataca d7?'}
    ]},
  { id:'cravada', nome:'Cravada', icone:'b',
    intro:'<b>Cravada</b> é quando uma peça não pode (ou não deve) sair do lugar, porque atrás dela, na mesma linha, há uma peça mais valiosa. Se a peça de trás for o rei, a peça cravada simplesmente <b>não pode se mover</b>. Bispos, torres e damas cravam.',
    ex:[
      {t:'seq', fen:'4k3/8/2n5/8/8/8/8/4KB2 w - - 0 1', p:'Crave o cavalo contra o rei usando o bispo.', line:['Bb5'],
        ok:'Cravado! O cavalo não pode sair, senão o rei ficaria em xeque.', err:'Coloque o bispo na diagonal que passa pelo cavalo (c6) e chega ao rei (e8).'},
      {t:'seq', fen:'4k3/8/8/4q3/8/8/8/R4K2 w - - 0 1', p:'A dama e o rei pretos estão na mesma coluna. Crave a dama com a torre!', line:['Re1','Qxe1+','Kxe1'],
        ok:'A dama cravada não pôde fugir: você trocou uma torre (5) por uma dama (9).', err:'Leve a torre para a coluna “e”, na frente da dama.'},
      {t:'seq', fen:'4k3/8/2n5/1B6/3P4/8/8/4K3 w - - 0 1', p:'O cavalo está cravado e não pode fugir. Ataque-o com o peão!', line:['d5','Ke7',['dxc6','Bxc6']],
        ok:'Regra de ouro: ataque a peça cravada. Ela não consegue escapar.', err:'Avance o peão para atacar o cavalo cravado.'},
      {t:'quiz', q:'Uma peça cravada contra o próprio REI pode sair da cravada?', opts:['Sim, se capturar algo','Não: o lance seria ilegal, pois deixaria o rei em xeque','Sim, mas perde a vez'], a:1,
        ok:'Isso. Por isso a cravada contra o rei é tão forte.', err:'Nenhum lance pode deixar o próprio rei em xeque.'}
    ]},
  { id:'espeto', nome:'Espeto', icone:'r',
    intro:'O <b>espeto</b> é o contrário da cravada: você ataca uma peça <b>valiosa</b> que é obrigada a sair da linha, e aí captura a peça que estava <b>atrás</b> dela. O espeto mais comum começa com um xeque.',
    ex:[
      {t:'seq', fen:'8/8/8/3k3q/8/8/8/R3K3 w - - 0 1', p:'Rei e dama pretos estão na mesma fileira. Dê xeque com a torre e ganhe a dama!', line:['Ra5+','Kd6','Rxh5'],
        ok:'Espeto! O rei saiu e a dama ficou sem proteção atrás dele.', err:'Dê xeque na 5ª fileira: o rei sai e a dama fica na mira.'},
      {t:'seq', fen:'6r1/8/8/3k4/8/8/2B5/4K3 w - - 0 1', p:'Agora na diagonal: dê xeque com o bispo e ganhe a torre.', line:['Bb3+','Kd6','Bxg8'],
        ok:'Espeto de bispo: xeque na diagonal e a torre cai.', err:'Rei (d5) e torre (g8) estão na mesma diagonal. Dê xeque nela com o bispo.'},
      {t:'seq', fen:'4q3/8/8/4k3/8/8/8/R5K1 w - - 0 1', p:'Rei na frente, dama atrás, na mesma coluna. Você sabe o que fazer.', line:['Re1+','Kd6','Rxe8'],
        ok:'Mais um espeto. Fique de olho em rei e dama alinhados!', err:'Dê xeque na coluna “e” com a torre.'},
      {t:'quiz', q:'Qual é a diferença entre cravada e espeto?', opts:['Na cravada a peça da frente vale menos; no espeto a da frente vale mais e precisa sair','Não há diferença','A cravada é só com cavalos'], a:0,
        ok:'Perfeito.', err:'Cravada: peça menos valiosa na frente. Espeto: peça mais valiosa na frente.'}
    ]},
  { id:'descoberto', nome:'Ataque descoberto', icone:'b',
    intro:'No <b>ataque descoberto</b> você move uma peça e, ao sair do caminho, ela <b>abre a linha</b> de outra peça sua que estava atrás. São duas ameaças num lance só: a da peça que se moveu e a da que foi “descoberta”. Se a peça descoberta dá xeque, é um <b>xeque descoberto</b>.',
    ex:[
      {t:'seq', fen:'4k3/8/8/8/4B3/8/q7/4R1K1 w - - 0 1', p:'Mova o bispo para atacar a dama. A torre atrás dele dará xeque descoberto!', line:[['Bd5+','Bb1+'],'Kd8','Bxa2'],
        ok:'O rei teve de cuidar do xeque da torre e o bispo capturou a dama.', err:'O bispo deve sair da coluna “e” indo para uma casa que ataque a dama em a2.'},
      {t:'seq', fen:'6k1/3q1pp1/8/8/8/3B4/8/3R2K1 w - - 0 1', p:'A torre está atrás do bispo, mirando a dama. Saia com o bispo dando xeque!', line:['Bh7+','Kxh7','Rxd7'],
        ok:'O bispo se sacrificou com xeque e a torre ganhou a dama.', err:'Mova o bispo com xeque para abrir a coluna da torre até a dama.'},
      {t:'quiz', q:'No ataque descoberto, de onde vem a ameaça “surpresa”?', opts:['Da peça que se moveu','Da peça que estava atrás e teve a linha aberta','Do rei'], a:1,
        ok:'Isso. E a peça que se moveu ainda pode criar uma segunda ameaça.', err:'A peça da frente sai e revela o ataque da peça de trás.'}
    ]},
  { id:'duplo', nome:'Xeque duplo', icone:'n',
    intro:'O <b>xeque duplo</b> é um xeque descoberto em que a peça que se move <b>também dá xeque</b>. O rei é atacado por duas peças de uma vez — não dá para bloquear nem capturar as duas, então a única defesa é <b>mover o rei</b>.',
    ex:[
      {t:'seq', fen:'4k3/8/8/8/4N3/8/8/4R1K1 w - - 0 1', p:'Mova o cavalo de modo que ele E a torre deem xeque ao mesmo tempo.', line:[['Nf6+','Nd6+']],
        ok:'Xeque duplo! Cavalo e torre atacam o rei juntos.', err:'O cavalo precisa sair da coluna “e” indo para uma casa que também ataque o rei.'},
      {t:'seq', fen:'3k4/8/8/8/3B4/8/8/3R2K1 w - - 0 1', p:'Agora com o bispo: dê xeque duplo.', line:[['Bb6+','Bf6+']],
        ok:'Isso! Bispo e torre atacam o rei ao mesmo tempo.', err:'Leve o bispo para uma diagonal que chegue ao rei em d8, abrindo a coluna da torre.'},
      {t:'seq', fen:'rnb1kb1r/pp3ppp/2p5/4q3/4n3/3Q4/PPPB1PPP/2KR1BNR w kq - 0 9', p:'Uma combinação famosa (Réti, 1910): sacrifique a dama em d8, dê xeque duplo e termine em mate!',
        steps:['Comece entregando a dama com xeque em d8.','Agora o xeque duplo: mova o bispo para g5.','O rei fugiu para c7. Dê o mate com o bispo.'],
        line:['Qd8+','Kxd8','Bg5+','Kc7','Bd8#'],
        ok:'Brilhante! O xeque duplo não deu tempo para as pretas respirarem.', err:'Siga a ideia: dama em d8 com xeque, depois o bispo sai dando xeque duplo.'},
      {t:'quiz', q:'Como se escapa de um xeque duplo?', opts:['Bloqueando com uma peça','Capturando uma das peças','Somente movendo o rei'], a:2,
        ok:'Exato. Por isso o xeque duplo é tão perigoso.', err:'Bloquear ou capturar só resolve um dos dois xeques. O rei tem que andar.'}
    ]},
  { id:'defensor', nome:'Remoção do defensor', icone:'q',
    intro:'Muitas vezes uma peça ou uma casa importante está protegida por <b>um único defensor</b>. Se você <b>capturar, trocar ou afastar</b> esse defensor, o que ele protegia cai. Sempre pergunte: “o que está segurando a posição do adversário?”',
    ex:[
      {t:'seq', fen:'r4rk1/ppp1qppp/5n2/6B1/8/3Q4/PPB2PPP/R4RK1 w - - 0 1', p:'O cavalo de f6 é o único que impede Dxh7 mate. Elimine o defensor!', line:['Bxf6','Qxf6','Qxh7#'],
        ok:'Sem o cavalo, ninguém mais defendia h7.', err:'Capture o cavalo de f6 com o bispo; depois a dama entra em h7.'},
      {t:'seq', fen:'r4rk1/ppp2ppp/2n5/1B2b3/8/5N2/PPP2PPP/R4RK1 w - - 0 1', p:'O bispo preto de e5 só é defendido pelo cavalo de c6. Tire o defensor e ganhe o bispo.', line:['Bxc6','bxc6','Nxe5'],
        ok:'Primeiro o defensor, depois a peça. Você ganhou um bispo limpo.', err:'Se capturar o bispo direto, o cavalo recaptura. Elimine o cavalo de c6 primeiro.',
        wrong:{'Nxe5':'Assim o cavalo de c6 recaptura e fica tudo igual. Elimine o defensor antes!'}},
      {t:'seq', fen:'r2r2k1/5ppp/8/8/8/8/3Q1PPP/3R2K1 w - - 0 1', p:'A torre de d8 guarda a última fileira. Troque-a e aproveite!', line:['Qxd8+','Rxd8','Rxd8#'],
        ok:'A dama se sacrificou para remover o defensor e a torre deu mate.', err:'Capture a torre de d8 com a dama: depois da recaptura, a sua torre entra com mate.'},
      {t:'quiz', q:'O que significa “remover o defensor”?', opts:['Tirar o próprio rei do perigo','Capturar ou afastar a peça que protege outra peça ou casa importante','Trocar as damas'], a:1,
        ok:'Isso mesmo.', err:'É eliminar a peça que faz o trabalho de defesa.'}
    ]}
]},
